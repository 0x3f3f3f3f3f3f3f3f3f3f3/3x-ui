name: Custom core
on:
  push:
    branches: [feature/custom-xray-unified-policy, feature/paired-custom-core-distribution]
    paths: ["core/**", "internal/distribution/**", "internal/database/**", "internal/web/service/**", "internal/web/controller/**", "internal/web/job/**", "internal/web/runtime/**", "internal/web/web.go", "internal/xray/**", "tools/build-custom-core.sh", "tools/prepare-core-test-geodata.py", "tools/run-go-test-batches.py", "tools/test-ci-test-tools.py", "tools/build-paired-package.sh", "tools/packagegen/**", "tools/packageverify/**", "tools/packagedeps/**", "tools/frontend-dependencies*.mjs", "tools/frontenddepsverify/**", "tools/install-paired-package.sh", "install.sh", "update.sh", "x-ui.sh", "tools/build-client-mapping-capability-fixture.sh", "tools/verify-client-mapping-completion.py", "tools/test-client-mapping-completion.py", "tools/build-mieru-capability-fixture.sh", "tools/verify-native-mieru-panel.py", "tools/build-ssh-capability-fixture.sh", "tools/verify-native-ssh-panel.py", "tools/build-snell-capability-fixture.sh", "tools/verify-native-snell-panel.py", "tools/verify-policy-tunnel-completion.py", "internal/sub/**", "internal/util/link/**", "frontend/**", "go.mod", "go.sum", ".github/workflows/custom-core.yml"]
  pull_request:
    paths: ["core/**", "internal/distribution/**", "internal/database/**", "internal/web/service/**", "internal/web/controller/**", "internal/web/job/**", "internal/web/runtime/**", "internal/web/web.go", "internal/xray/**", "tools/build-custom-core.sh", "tools/prepare-core-test-geodata.py", "tools/run-go-test-batches.py", "tools/test-ci-test-tools.py", "tools/build-paired-package.sh", "tools/packagegen/**", "tools/packageverify/**", "tools/packagedeps/**", "tools/frontend-dependencies*.mjs", "tools/frontenddepsverify/**", "tools/install-paired-package.sh", "install.sh", "update.sh", "x-ui.sh", "tools/build-client-mapping-capability-fixture.sh", "tools/verify-client-mapping-completion.py", "tools/test-client-mapping-completion.py", "tools/build-mieru-capability-fixture.sh", "tools/verify-native-mieru-panel.py", "tools/build-ssh-capability-fixture.sh", "tools/verify-native-ssh-panel.py", "tools/build-snell-capability-fixture.sh", "tools/verify-native-snell-panel.py", "tools/verify-policy-tunnel-completion.py", "internal/sub/**", "internal/util/link/**", "frontend/**", "go.mod", "go.sum", ".github/workflows/custom-core.yml"]
permissions:
  contents: read
env:
  GOTOOLCHAIN: go1.27.1
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache-dependency-path: |
            go.sum
            core/xray/go.sum
      - name: Package validation tests
        run: go test -race -count=1 ./internal/distribution
      - name: Stable inbound resource identities (sqlite)
        env:
          XUI_DB_TYPE: sqlite
        run: |
          set -euo pipefail
          make dist-stub
          go test -race -count=1 -v ./internal/database ./internal/web/service \
            -run '^TestInboundStableIdentity' | tee /tmp/inbound-identities-sqlite.log
          for test in TestInboundStableIdentityRestoreStaging TestInboundStableIdentityDatabaseExport TestInboundStableIdentityHistoricalMigration TestInboundStableIdentityRejectsCorruptMigration TestInboundStableIdentityLifecycle TestInboundStableIdentityPublicCopyAndImport TestInboundStableIdentityPublicNativeEdits; do
            grep -q -- "^--- PASS: $test " /tmp/inbound-identities-sqlite.log
          done
      - name: Source snapshot and database replacement regressions (sqlite)
        env:
          XUI_DB_TYPE: sqlite
          XUI_DB_DSN: ""
          XUI_TEST_PG_DSN: ""
        run: |
          set -euo pipefail
          make dist-stub
          go test -race -count=1 -v -timeout 10m ./internal/database ./internal/web/service \
            -run '^Test(CopyAllModelsUsesOneSourceSnapshot|DumpSQLiteUsesOneSourceSnapshot|DatabaseRestore|TrafficWriterQueuedTransactionCannotCrossDatabaseReplacement|ClientPolicyDelayedLedgerReplyCannotCrossDatabaseReplacement)' | tee /tmp/restore-regressions-sqlite.log
          for test in TestCopyAllModelsUsesOneSourceSnapshot TestDumpSQLiteUsesOneSourceSnapshot TestDatabaseRestoreAcceptsConfirmedAbsentCore TestDatabaseRestoreStopFailureLeavesDatabaseAndRuntimeUntouched TestTrafficWriterQueuedTransactionCannotCrossDatabaseReplacement TestClientPolicyDelayedLedgerReplyCannotCrossDatabaseReplacement; do
            grep -q -- "^--- PASS: $test " /tmp/restore-regressions-sqlite.log
          done
          for boundary in next-batch next-table; do
            grep -q -- "--- PASS: TestCopyAllModelsUsesOneSourceSnapshot/sqlite/$boundary " /tmp/restore-regressions-sqlite.log
          done
      - name: CI test helper behavior checks
        run: python3 tools/test-ci-test-tools.py
      - name: Prepare pinned complete geodata for core tests
        run: python3 tools/prepare-core-test-geodata.py
      - name: Core unit tests
        working-directory: core/xray
        run: go test -shuffle=on -count=1 ./...
      - name: Core race checks
        working-directory: core/xray
        run: |
          go test -race -count=1 ./app/clientpolicy/... ./app/commander ./app/dispatcher ./app/proxyman/inbound ./app/proxyman/outbound ./app/reverse ./app/router ./app/stats ./app/trafficcontrol ./infra/conf ./proxy ./proxy/dokodemo ./proxy/loopback ./proxy/socks ./proxy/http ./proxy/mieru ./proxy/snell ./proxy/ssh ./proxy/vless/inbound ./proxy/vless/outbound ./proxy/wireguard ./common/buf ./common/mux ./common/protocol ./common/signal ./transport/internet/udp ./transport/internet/websocket ./transport/internet/splithttp ./transport/internet/httpupgrade ./transport/internet/finalmask/realm ./testing/policy
          go test -race -count=1 ./core -run '^(TestRejectedHandlerConstructionClosesProxy|TestTrafficDrain)'
      - name: Tunnel datagram integrity and selected-proxy half-close
        working-directory: core/xray
        run: |
          set -euo pipefail
          go test -race -count=1 -v ./testing/policy ./proxy/socks \
            -run '^TestTunnelFirst(Large|Empty)UDPDatagram|^TestTunnelConfiguredIPv4IPv6AndDomainTargets$|^TestTunnelTCPHalfClose|^TestTunnelSelectedSocks(LargeUpload|LargeReply|EmptyDatagram)|^TestUDPWriterRespectsWireHeaderLimit$|^TestNativeSnellOutboundSniffingIdleCancellation$' | tee /tmp/policy-tunnel-core.log
          python3 ../../tools/verify-policy-tunnel-completion.py core /tmp/policy-tunnel-core.log
      - name: Tunnel mux routing and legacy compatibility
        working-directory: core/xray
        run: |
          set -euo pipefail
          go test -race -count=1 -v ./testing/policy -run '^(TestTunnelFixedOutboundTreatsMuxDestinationAsPayload|TestLegacyUnownedTunnelMuxStillDispatches)$' | tee /tmp/tunnel-mux-compatibility.log
          for test in TestTunnelFixedOutboundTreatsMuxDestinationAsPayload TestLegacyUnownedTunnelMuxStillDispatches; do
            grep -q -- "--- PASS: $test " /tmp/tunnel-mux-compatibility.log
          done
      - name: Native mieru official-library interoperability and policy
        working-directory: core/xray
        run: |
          set -euo pipefail
          go test -race -count=1 -v ./proxy/mieru ./infra/conf -run '^(TestMieruNative|TestNativeMieru|TestReview)' | tee /tmp/native-mieru.log
          for test in TestNativeMieruOutboundPoolIsolatesAuthenticationAndCancellation TestNativeMieruDisableAndExpiryCloseTCPAndUDP TestNativeMieruAndTunnelShareUploadAndDownloadRate TestReviewUDPPartialHandshakeCannotDefeatTimeout TestReviewUDPFailedHandshakeMustReleaseCapacity TestReviewOutboundHighMultiplexingSharesTransport TestReviewOutboundClientCloseReleasesQuietPeer TestReviewCancellationInterruptsPendingOfficialHandshake TestNativeMieruOutboundHandshakeTimeoutIsAbsolute TestReviewPoolDoesNotShareDistinctSelectedGateways TestReviewPoolCloseCannotLeakLateDialResult TestReviewNativeInboundHonorsSniffing TestReviewUDPAssociateMayUseUnspecifiedTarget TestReviewNativeStreamWrappersAreRejected TestReviewEmptyUDPDatagramReachesTarget TestNativeMieruUDPRoutesEveryDestinationIncludingDomain TestNativeMieruIPv6TCPDestination TestNativeMieruLargeUDPDatagramKeepsBoundaryAndBilling TestNativeMieruConcurrentMuxSameCredentialsRemainUsable TestNativeMieruSharesTunnelPolicyAndLiveQuota TestNativeMieruUnauthenticatedTimeoutReleasesCapacity TestNativeMieruCloseReleasesNativeListeners TestNativeMieruCredentialRotationClosesOldMuxAndPreservesSibling TestNativeMieruOutboundUsesOfficialServer TestNativeMieruOfficialClientPayloadUsesCoreDispatcher TestMieruNativeConfigRejectsUnusableIdentityAndTransport TestMieruNativeConfigBuildsAuthenticatedInboundAndOutbound; do
            grep -q -- "^--- PASS: $test " /tmp/native-mieru.log
          done
      - name: Native SSH OpenSSH forwarding and lifecycle
        working-directory: core/xray
        run: |
          set -euo pipefail
          command -v ssh
          go test -race -count=1 -v -timeout=90s ./proxy/ssh ./testing/policy -run '^(TestOutbound|TestSSH|TestChannel)' | tee /tmp/native-ssh.log
          for test in TestSSHOpenSSHDirectSharesTunnelLedgerAndDisable TestSSHOpenSSHReverseMetersClientRelativeDirection TestSSHNativeOutboundStrictPinAndRoutedPayload TestSSHMissingPolicyAndBlockedRouteCannotReachTarget TestSSHChannelEOFAndCredentialRemovalPreserveTunnelSibling TestSSHAndTunnelShareLiveDirectionalRates TestSSHQuotaAndExpiryCloseIdleTransportAndTunnelSibling TestSSHRestartRetainsBusinessHostKeyAndSharedUsage TestSSHPasswordDefaultOffRejectsCorrectPassword TestSSHPasswordOptInRotationAndRemovalPreserveCanonicalSiblings TestSSHReversePortZeroCancellationAndDisableReleaseOwnedResources TestSSHReverseAuthorizationChecksBindPortAndRealSource TestSSHConnectionChannelHandshakeAndIdleBounds TestSSHCancelledPendingReverseOpenCannotLeakAcceptedChannel TestSSHVerifiedAuthenticationCannotTransferRevokedOfferToReplacement TestSSHStalledControlWriteClosesWithinChannelBound TestChannelCapacityRetainsDelayedPeerCloseAndOwnedDrains TestChannelRetirementTimeoutClosesTransportAndJoinsOwnedDrains TestOutboundUDPReturnsExplicitUnsupportedNetwork TestOutboundHostMismatchReturnsTypedError TestOutboundHandshakeCancellationClosesSuppliedTransport TestOutboundHandshakeUsesAbsoluteDeadline TestOutboundIdleClosesBothCopyDirectionsAtConfiguredDeadline; do
            grep -q -- "^--- PASS: $test " /tmp/native-ssh.log
          done
      - name: Native Snell versions and QUIC payload lifecycle
        working-directory: core/xray
        run: |
          set -euo pipefail
          go test -race -shuffle=on -count=1 -v ./proxy/snell ./proxy/socks ./infra/conf ./testing/policy ./transport/internet/udp ./app/proxyman/inbound -run '^TestNativeSnell|^TestOutbound|^TestHubFullDatagrams|^TestUDPWorkerNativeTimeout|^TestNativeCanonical|^TestNativeMalformed|^TestNativeRejects' | tee /tmp/native-snell-core.log
          for test in TestNativeSnellOutboundSniffingIdleCancellation TestNativeSnellDownloadedSOCKSDatagramsPreserveLegacyDefault TestNativeSnellDownloadedSOCKSConfigRequiresUDP TestNativeRejectsWrappedTransports TestNativeCanonicalUUID TestNativeMalformedAddressRejectsWithoutPanic TestOutboundUDPIdleCleanupUsesPolicy TestOutboundCloseFencesLateDials TestOutboundCapacityIncludesPendingDials TestOutboundReuseScopeAndCredentialFence TestOutboundNonreuseHandshakeWriteUsesPolicy TestNativeSnellConfigVersions TestNativeSnellConfigRejectsUnsupportedModes TestNativeSnellInboundHTTPAndV6UnshapedTCPUDP TestNativeSnellCredentialRemovalRotationAndSibling TestNativeSnellQuotaExpiryAndMissingPolicy TestNativeSnellOutboundUDPFirst13kEmptyExactLedger TestNativeSnellWireIDsShareCanonicalRateAndLedger TestNativeSnellUDPDisableExpiryQuotaAndCredentialCleanup TestNativeSnellUDPWireBoundary TestNativeSnellUDPVersions TestNativeSnellRespectsHandshakeTimeout TestNativeSnellUDPFirst13kEmptyDomainIPv6SourceAndRoutePolicy TestNativeSnellTCPVersionsPolicyAndRouteDeny TestNativeSnellOutboundVersions TestNativeSnellTCPReuseIdleStartsAfterLogicalCompletion TestNativeSnellUDPDownlinkRefreshesIdle TestNativeSnellV5QUICInboundEnvelopeRawRepeatedCanonicalLedger TestNativeSnellV5QUICFirst13kDomainIPv6SourceIsolationAndRouteDeny TestNativeSnellV5QUICDisableExpiryQuotaRemovalAndHandlerCleanup TestNativeSnellV5QUICMissingDisabledExpiredPolicyRejectsFreshSource TestNativeSnellV5QUICWireIDsShareDirectionalRates TestNativeSnellV5QUICDownlinkIdleRefreshAndAssociationReclaim TestNativeSnellV5QUICCredentialRotationPreservesSiblingAndLedger TestNativeSnellV5QUICRealV1V2HTTP3BothDirections TestNativeSnellQUICUnauthenticatedHandshakeBound TestNativeSnellQUICPhysicalCapacityAndCloseJoin TestNativeSnellQUICLateDialFencesHandlerCredentialAndRequest TestNativeSnellQUICFirstWriteObeysHandshakeBound TestNativeSnellQUICCloseBeforeFirstDatagram TestNativeSnellQUICConcurrentPendingBoundAndJoin TestNativeSnellQUICHandshakePrecedesConnectionIdle TestNativeSnellQUICRejectsEmbeddedHostWhitespace TestHubFullDatagramsOptInPreservesLargeAndEmpty TestUDPWorkerNativeTimeoutOwnershipPreservesLegacyReaper; do
            grep -q -- "^--- PASS: $test " /tmp/native-snell-core.log
          done
          for version in v1 v2; do
            grep -q -- "--- PASS: TestNativeSnellV5QUICRealV1V2HTTP3BothDirections/inbound/quic-$version " /tmp/native-snell-core.log
          done
      - name: Pinned Snell source and extraction hashes
        run: |
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          root = Path("core/deps")
          upstream = json.loads((root / "opensnell.UPSTREAM.json").read_text())
          assert len(upstream["file_sha256"]) == upstream["complete_upstream_files"] == 42
          actual = {str(p.relative_to(root / "opensnell")) for p in (root / "opensnell").rglob("*") if p.is_file()}
          assert actual == set(upstream["file_sha256"])
          for path, digest in upstream["file_sha256"].items():
              assert hashlib.sha256((root / "opensnell" / path).read_bytes()).hexdigest() == digest, path
          for path, digest in upstream["extraction"]["native_file_sha256"].items():
              assert hashlib.sha256((root / path).read_bytes()).hexdigest() == digest, path
          snell = json.loads((root / "sing-snell.UPSTREAM.json").read_text())
          for file in snell["modified_files"]:
              assert hashlib.sha256((root / "sing-snell" / file["path"]).read_bytes()).hexdigest() == file["managed_sha256"], file["path"]
          PYCODE
      - name: Build custom core
        run: bash tools/build-custom-core.sh
      - name: Build original pre-mapping private core
        run: bash tools/build-client-mapping-capability-fixture.sh
      - name: Original mapping journal fence and private history proof
        run: |
          set -euo pipefail
          go test -race -count=1 -v ./internal/policyauthority -run '^TestClientMapping' | tee /tmp/client-mapping-journal.log
          go -C core/xray test -race -count=1 -v ./app/clientpolicy ./app/clientpolicy/command -run '^TestClientAuthorityHistory' | tee /tmp/client-mapping-history.log
          python3 - <<'PYCODE'
          import re
          from pathlib import Path
          required = {
              '/tmp/client-mapping-journal.log': ['TestClientMappingRetainsBothAnchorsAndUsedRetry', 'TestClientMappingRefusesRetargetAndHiddenHistory', 'TestClientMappingFencesOlderWritersAndCorruption', 'TestClientMappingPreservesResetProgressFence', 'TestClientMappingRefusesInitialSourceAndHistoricalGrant', 'TestClientMappingPagesAcrossNodesWithoutResettingGlobalBalance', 'TestClientMappingCursorFitsMaximumSource', 'TestClientMappingConcurrentRetryCommitsOnce', 'TestClientMappingRejectsCorruption'],
              '/tmp/client-mapping-history.log': ['TestClientAuthorityHistorySurvivesSealAndReopen', 'TestClientAuthorityHistoryPrivateRPC'],
          }
          for path, names in required.items():
              log = Path(path).read_text()
              passed = re.findall(r'^--- PASS: (Test\w+) ', log, re.M)
              assert all(passed.count(name) == 1 for name in names), path
              assert not re.search(r'^\s*--- (FAIL|SKIP):|^FAIL(?:\s|$)|no tests to run', log, re.M), path
          PYCODE
      - name: Owned node authority discovery and delegation (sqlite)
        run: |
          set -euo pipefail
          make dist-stub
          XRAY_E2E_BINARY="$PWD/build/custom-xray" go test -race -count=1 -v -timeout 10m ./internal/web/service ./internal/sub \
            -run '^Test(ManagedAuthorityNodeDiscovery|ManagedDelegatedNode|NodeAuthorityDiscoveryHTTPActualOwnedCore|NodeDelegationHTTPActualOwnedCore)' | tee /tmp/node-authority-sqlite.log
          for test in TestManagedAuthorityNodeDiscoveryUsesCurrentOwnedBoot TestManagedAuthorityNodeDiscoveryRejectsUnsafeOwnership TestNodeAuthorityDiscoveryHTTPActualOwnedCore TestManagedDelegatedNodeStartsWithoutLocalIssuer TestManagedDelegatedNodeRestartRetainsRole TestManagedDelegatedNodeRejectsLocalResetBeforeCapture TestNodeDelegationHTTPActualOwnedCore; do
            grep -q -- "^--- PASS: $test " /tmp/node-authority-sqlite.log
          done
          grep -q -- 'node authority discovery backend: sqlite' /tmp/node-authority-sqlite.log
          grep -q -- 'node delegation backend: sqlite' /tmp/node-authority-sqlite.log
          if grep -Eq -- '^[[:space:]]*--- (FAIL|SKIP):|^FAIL([[:space:]]|$)|no tests to run' /tmp/node-authority-sqlite.log; then
            echo 'required node authority discovery/delegation test failed or skipped' >&2
            exit 1
          fi
      - name: Canonical client mapping and actual TCP UDP billing (sqlite)
        env:
          XUI_DB_TYPE: sqlite
          XRAY_PRE_MAPPING_BINARY: ${{ github.workspace }}/build/pre-client-mapping-xray
        run: |
          set -euo pipefail
          python3 tools/test-client-mapping-completion.py
          make dist-stub
          XRAY_E2E_BINARY="$PWD/build/custom-xray" go test -race -count=1 -v -timeout 10m ./internal/web/service ./internal/web/controller ./internal/web/runtime ./internal/sub \
            -run '^Test(NodeClientMappingRequiresOwnedFreshPolicy|NodeClientMappingPreservesOriginalEvidence|CoordinatorClientMappingPinsOriginalJournal|NodeClientMappingHTTPAuthenticationAndBounds|ClientMappingEffectivePolicyDigestIgnoresOnlyIdentityAndVersion|NodeClientMappingJSONCanonicalAndBounded|RemoteClientMappingRequiresVerifiedProof|MappedRemoteAuthorityAPITranslatesCanonicalIdentity|NodeClientMappingHTTPActualCanonicalGrant)$' | tee /tmp/client-mapping-sqlite.log
          python3 tools/verify-client-mapping-completion.py sqlite /tmp/client-mapping-sqlite.log
      - name: Typed authority transport and native business acceptance (sqlite)
        env:
          XUI_DB_TYPE: sqlite
        run: |
          set -euo pipefail
          make dist-stub
          XRAY_E2E_BINARY="$PWD/build/custom-xray" go test -race -count=1 -v -timeout 10m ./internal/web/service ./internal/web/controller ./internal/web/runtime ./internal/sub \
            -run '^(TestNodeAuthorityControlHTTPActualJournalGrant|TestNodeAuthorityControlRequiresOwnedDelegatedCore|TestNodeAuthorityControlBindsEveryOperation|TestNodeAuthorityControlHTTPAuthenticationAndBounds|TestNodeSyncScopeAllowlistMatchesRemoteInventory|TestRemoteAuthorityControlRequiresVerifiedTLS|TestRemoteAuthorityControlRejectsAmbiguousPayloads|TestRemoteAuthorityAPIPreservesBinding)$' | tee /tmp/authority-control-sqlite.log
          python3 - sqlite /tmp/authority-control-sqlite.log <<'PYCODE'
          import re, sys
          from pathlib import Path
          backend, path = sys.argv[1:]
          log = Path(path).read_text()
          required = ['TestNodeAuthorityControlHTTPActualJournalGrant', 'TestNodeAuthorityControlRequiresOwnedDelegatedCore', 'TestNodeAuthorityControlBindsEveryOperation', 'TestNodeAuthorityControlHTTPAuthenticationAndBounds', 'TestNodeSyncScopeAllowlistMatchesRemoteInventory', 'TestRemoteAuthorityControlRequiresVerifiedTLS', 'TestRemoteAuthorityControlRejectsAmbiguousPayloads', 'TestRemoteAuthorityAPIPreservesBinding']
          passed = re.findall(r"^--- PASS: (Test\w+) ", log, re.M)
          assert all(passed.count(name) == 1 for name in required), "missing or duplicate authority parent"
          assert not re.search(r"^\s*--- (FAIL|SKIP):|^FAIL(?:\s|$)|no tests to run", log, re.M), "authority test failed/skipped/absent"
          for marker in ("node authority journal HTTP backend: ", "node authority local issuer HTTP backend: ", "node authority control backend: "):
              assert set(re.findall(re.escape(marker) + r"(\w+)", log)) == {backend}, "wrong actual database backend"
          print(f"authority transport {backend}: {len(required)} exact parents passed")
          PYCODE
          XRAY_E2E_BINARY="$PWD/build/custom-xray" go test -race -count=1 -v -timeout 10m ./internal/sub \
            -run '^(TestMieruHTTPExportRealCoreLifecycle|TestSnellHTTPExportRealCoreTCPUDPQUICAndSharedLifecycle|TestSSHHTTPExportRealOpenSSHAndSharedLifecycle|TestSSHHTTPAuthorizedReverseAndStrictNativeOutbound|TestClientPolicyBulkHTTPNativeBindingsAndTunnelAccounting)$' | tee /tmp/authority-native-sqlite.log
          for test in TestMieruHTTPExportRealCoreLifecycle TestSnellHTTPExportRealCoreTCPUDPQUICAndSharedLifecycle TestSSHHTTPExportRealOpenSSHAndSharedLifecycle TestSSHHTTPAuthorizedReverseAndStrictNativeOutbound TestClientPolicyBulkHTTPNativeBindingsAndTunnelAccounting; do
            grep -q -- "^--- PASS: $test " /tmp/authority-native-sqlite.log
          done
          if grep -Eq -- '^[[:space:]]*--- (FAIL|SKIP):|^FAIL([[:space:]]|$)|no tests to run' /tmp/authority-native-sqlite.log; then
            echo 'required native business acceptance failed or skipped' >&2
            exit 1
          fi
      - name: Bulk native client policy HTTP and Tunnel accounting (sqlite)
        run: |
          set -euo pipefail
          make dist-stub
          XRAY_E2E_BINARY="$PWD/build/custom-xray" go test -race -count=1 -v ./internal/sub \
            -run '^TestClientPolicyBulkHTTPNativeBindingsAndTunnelAccounting$' | tee /tmp/policy-tunnel-sqlite.log
          python3 tools/verify-policy-tunnel-completion.py sqlite /tmp/policy-tunnel-sqlite.log
      - name: Build missing native mieru identity capability fixture
        run: bash tools/build-mieru-capability-fixture.sh
      - name: Native mieru panel public lifecycle and official export
        run: |
          set -euo pipefail
          make dist-stub
          XRAY_E2E_BINARY="$PWD/build/custom-xray" XRAY_PRE_MIERU_MARKER_E2E_BINARY="$PWD/build/pre-mieru-marker-xray" \
            go test -race -count=1 -v ./internal/database/model ./internal/database ./internal/web/service ./internal/xray ./internal/sub ./internal/util/link github.com/xtls/xray-core/app/clientpolicy/command \
            -run '^TestMieru|^TestCapabilitiesAdvertiseVerifiedNativeMieru' | tee /tmp/native-mieru-panel-sqlite.log
          python3 tools/verify-native-mieru-panel.py sqlite /tmp/native-mieru-panel-sqlite.log
      - name: Build missing native SSH identity capability fixture
        run: bash tools/build-ssh-capability-fixture.sh
      - name: Native SSH panel public OpenSSH lifecycle and strict outbound
        run: |
          set -euo pipefail
          make dist-stub
          XRAY_E2E_BINARY="$PWD/build/custom-xray" XRAY_PRE_SSH_MARKER_E2E_BINARY="$PWD/build/pre-ssh-marker-xray" \
            go test -race -count=1 -v ./internal/database/model ./internal/database ./internal/web/service ./internal/xray ./internal/sub github.com/xtls/xray-core/app/clientpolicy/command \
            -run '^TestSSH|^TestCapabilitiesAdvertiseVerifiedNativeSSH$|^TestMigrationModelsMatchPanelModels$' | tee /tmp/native-ssh-panel-sqlite.log
          python3 tools/verify-native-ssh-panel.py sqlite /tmp/native-ssh-panel-sqlite.log
      - name: Build missing native Snell identity capability fixture
        run: bash tools/build-snell-capability-fixture.sh
      - name: Native Snell panel public exports and TCP UDP QUIC lifecycle
        run: |
          set -euo pipefail
          make dist-stub
          XRAY_E2E_BINARY="$PWD/build/custom-xray" XRAY_PRE_SNELL_MARKER_E2E_BINARY="$PWD/build/pre-snell-marker-xray" \
            go test -race -count=1 -v ./internal/database/model ./internal/database ./internal/web/service ./internal/xray ./internal/sub github.com/xtls/xray-core/app/clientpolicy/command \
            -run '^TestSnell|^TestCapabilitiesAdvertiseVerifiedNativeSnell$|^TestMigrationModelsMatchPanelModels$' | tee /tmp/native-snell-panel-sqlite.log
          python3 tools/verify-native-snell-panel.py sqlite /tmp/native-snell-panel-sqlite.log
      - name: Password proxy identity and credential lifecycle
        working-directory: core/xray
        run: |
          set -euo pipefail
          go test -race -count=1 -v ./testing/policy ./proxy/socks -run '^TestPassword|^TestTempUDPConn' | tee /tmp/password-proxy-lifecycle.log
          for test in TestPasswordProxiesShareTunnelIdentityAndDisconnect TestPasswordProxiesWithoutPolicyFailClosed TestPasswordProxiesCredentialRemovalAndReadd TestPasswordProxiesUDPIdentityAndCredentialCleanup TestPasswordHTTPKeepAlivePreservesRequestIdentity TestPasswordMixedAliasesShareDirectionalRates TestPasswordMixedLegacyNoAuthIgnoresUnusedAccounts TestPasswordProxiesEmptyAccountsStayAuthenticated TestPasswordProxiesPreserveLegacyAnonymousAndLabels TestTempUDPConnCloseBeforeTimeout TestTempUDPConnConcurrentTimeoutAndClose; do
            grep -q -- "^--- PASS: $test " /tmp/password-proxy-lifecycle.log
          done
      - name: Build missing password identity capability fixture
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          source = Path("core/xray/app/clientpolicy/command/command.go").resolve()
          fixture = Path(os.environ["RUNNER_TEMP"]) / "password-identity-capability-fixture"
          fixture.mkdir(exist_ok=True)
          text = source.read_text()
          capability = 'features = append(features, "trusted-socks-client-id-v1", "trusted-http-client-id-v1")'
          assert text.count(capability) == 1
          replacement = fixture / "command.go"
          replacement.write_text(text.replace(capability, "", 1))
          (fixture / "overlay.json").write_text(json.dumps({"Replace": {str(source): str(replacement)}}))
          PYCODE
          go -C core/xray build -overlay="$RUNNER_TEMP/password-identity-capability-fixture/overlay.json" -o "$PWD/build/pre-password-identity-xray" ./main
      - name: Password proxy capability negotiation
        run: |
          set -euo pipefail
