name: Custom core
on:
  push:
    branches: [feature/custom-xray-unified-policy]
    paths: ["core/**", "internal/database/**", "internal/web/service/**", "internal/web/job/**", "internal/web/runtime/**", "internal/web/web.go", "internal/xray/**", "tools/build-custom-core.sh", "go.mod", "go.sum", ".github/workflows/custom-core.yml"]
  pull_request:
    paths: ["core/**", "internal/database/**", "internal/web/service/**", "internal/web/job/**", "internal/web/runtime/**", "internal/web/web.go", "internal/xray/**", "tools/build-custom-core.sh", "go.mod", "go.sum", ".github/workflows/custom-core.yml"]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            core/xray/go.sum
      - name: Core unit tests
        working-directory: core/xray
        run: go test -shuffle=on -count=1 ./...
      - name: Core race checks
        working-directory: core/xray
        run: |
          go test -race -count=1 ./app/clientpolicy/... ./app/commander ./app/dispatcher ./app/proxyman/inbound ./app/proxyman/outbound ./app/reverse ./app/stats ./app/trafficcontrol ./infra/conf ./proxy ./proxy/dokodemo ./proxy/vless/inbound ./proxy/vless/outbound ./proxy/wireguard ./common/buf ./common/mux ./common/protocol ./transport/internet/udp ./transport/internet/websocket ./transport/internet/splithttp ./transport/internet/httpupgrade ./transport/internet/finalmask/realm ./testing/policy
          go test -race -count=1 ./core -run '^(TestRejectedHandlerConstructionClosesProxy|TestTrafficDrain)'
      - name: Build custom core
        run: bash tools/build-custom-core.sh
      - name: Build missing credential capability fixture
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source = Path("core/xray/app/clientpolicy/command/command.go").resolve()
          fixture = Path(os.environ["RUNNER_TEMP"]) / "policy-capability-fixture"
          fixture.mkdir(exist_ok=True)
          text = source.read_text()
          capability = ', "authenticated-credential-revocation-v1"'
          assert text.count(capability) == 1
          replacement = fixture / "command.go"
          replacement.write_text(text.replace(capability, "", 1))
          (fixture / "overlay.json").write_text(json.dumps({"Replace": {str(source): str(replacement)}}))
          PY
          go -C core/xray build -overlay="$RUNNER_TEMP/policy-capability-fixture/overlay.json" -o "$PWD/build/pre-revocation-xray" ./main
      - name: Build panel against same managed source
        run: make dist-stub && go build ./...
      - name: Panel policy SQLite and adapter race checks
        run: go test -race ./internal/database ./internal/web/service ./internal/xray -run 'TestClientStableIdentity|TestClientPolicyLedger|TestClientPolicyAdapter|TestTunnelOwner' -count=1
      - name: Build pinned unmodified core for rejection regression
        run: |
          upstream_core_dir="$(go mod download -json github.com/xtls/xray-core@v1.260327.1-0.20260908222543-52a412d9e2f5 | jq -er .Dir)"
          go -C "$upstream_core_dir" build -buildvcs=false -o "$GITHUB_WORKSPACE/build/upstream-xray" ./main
      - name: Runtime transport and negotiated process activation
        run: |
          set -o pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" XRAY_UPSTREAM_E2E_BINARY="$PWD/build/upstream-xray" XRAY_PRE_REVOCATION_E2E_BINARY="$PWD/build/pre-revocation-xray" \
            go test -race ./internal/xray ./internal/web/runtime -run 'TestManagedProcess|TestManagedMutation|TestLocalRuntimeUsesPrivateControl|TestXrayAPI_E2E|TestExplicitControlEndpoint|TestPrivateControl|TestFinalTraffic|TestTrafficControl|TestAutomaticTrafficControl|TestTrafficHandoffImage' -count=1 -v | tee /tmp/policy-process.log
          for test in TestManagedProcessNegotiatesAndSeedsBeforeOpeningListeners TestManagedProcessRejectsUnmodifiedCoreBeforeBusinessTraffic TestManagedProcessNegotiatesCredentialRevocationBeforePreparation TestManagedMutationRequiresCredentialRevocationBeforeHandlerChanges TestLocalRuntimeUsesPrivateControlForHandlersRoutingAndStats TestFinalTrafficReplaysPendingThenSettlesFreshSnapshot TestFinalTrafficStartupCannotPinAnotherProcess TestFinalTrafficRejectsCancellationAfterPendingReplay TestFinalTrafficRejectsExhaustedSequenceBeforeDrain TestTrafficControlClientPinsEveryPageAndRejectsWrongPeer TestTrafficControlEndpointChangesRequireRestart TestAutomaticTrafficControlPinsCustomChildWithoutChangingDesiredConfig TestAutomaticTrafficControlCleansRejectedChild TestAutomaticTrafficControlPreservesExplicitDirectory TestAutomaticTrafficControlVersionHint TestFinalTrafficCounterNamesPreserveDelimiterEmails TestFinalTrafficOwnersRetainAdditionsBeforeDrain TestFinalTrafficOwnersRejectAdditionsAfterDrain TestFinalTrafficOwnershipBlocksOrdinaryPolling TestTrafficHandoffImageMustExecuteBeforeReturning TestTrafficHandoffImagePreservesDefaultResourceDirectory; do
            grep -q -- "^--- PASS: $test " /tmp/policy-process.log
          done
      - name: SQLite policy persistence and Runtime client edits
        run: |
          set -o pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" go test -race ./internal/web/service ./internal/web/job ./internal/web/controller \
            -run 'TestTunnelOwner|TestClientPolicy(StateProvisioning|RuntimeBootstrap|Options|Omission|SyncPreservesAbsentAndExplicitPolicy|RemoteScope|LocalReservation|Desired|Polling|Config|Reset|Accounting|Lifecycle|Renewal|FirstUse)|TestScheduledTrafficReset|TestPeriodicTrafficReset|TestPeriodicResetReaches' -count=1 -v | tee /tmp/policy-bootstrap.log
          for test in TestClientPolicySyncPreservesAbsentAndExplicitPolicy TestTunnelOwnerSelectionUsesCanonicalClient TestTunnelOwnerSelectionReadsAuthoritativeIdentity TestTunnelOwnerSelectionRejectsInvalidScopeAtomically TestTunnelOwnerSelectionRollsBackLateLinkFailure TestTunnelOwnerSelectionUpdateRollsBackHistoryAndMembership TestTunnelOwnerSelectionReadRejectsAmbiguityAndDatabaseFailure TestTunnelOwnerSelectionRehomesCanonicalHistoryWithStaleSettings TestTunnelOwnerSelectionRejectsLaterRemoteAttachment TestTunnelOwnerSelectionRejectsLegacyRemoteGraphBeforeUpdateFanout TestTunnelOwnerSelectionRejectsFilteredRemoteMirror TestTunnelOwnerReplacementPreservesHistoryThroughMigration TestTunnelOwnerSelectionReassignsLiveTCPAndUDP TestTunnelOwnerImportIgnoresSourcePanelIdentity TestClientPolicyRemoteScopeRejectsBeforeFanout TestClientPolicyRemoteScopeSyncBoundary TestClientPolicyRemoteScopeRejectsMirrorAtomically TestClientPolicyRemoteScopeMirrorChecksBeforeIdentityFilters TestClientPolicyRemoteScopeMetadataPreservesStoredPolicy TestClientPolicyLocalReservationRejectsRemoteMembership TestClientPolicyRuntimeBootstrapPreservesLedgerAcrossChildRestarts TestClientPolicyPollingRetriesCommittedTraffic TestClientPolicyConfigFeedsRealTunnelLedger TestClientPolicyConfigPreparesEveryPolicyBatch TestClientPolicyResetBatchRollsBackEveryBoundary TestClientPolicyResetBatchRetriesKeepIndependentLatestWindows TestClientPolicyResetBulkPinsMembershipBeforeCoreRecovery TestClientPolicyResetAllRetryExcludesNewClientsAndNewUsage TestClientPolicyResetInboundBatchUsesLinksAndKeepsItsOriginalMembers TestClientPolicyResetBulkCommitsLegacyEnableWithItsCounters TestClientPolicyResetBulkPreservesRemoteInboundFields TestClientPolicyResetRetriesKeepTheLatestWindowAndLifetime TestClientPolicyResetRuntimePollingRetriesTheCommittedBoundary TestClientPolicyResetEntrypointsProtectStoppedAndPreparedClients TestClientPolicyResetEntrypointsRecheckAfterQueuedBootstrap TestClientPolicyResetEntrypointsRejectReusedEmailWhileQueued TestClientPolicyAccountingPendingIncludesSavedUnpreparedChanges TestClientPolicyAccountingIncludesEverySnapshotBatch TestClientPolicyAccountingWaitsForResetAcknowledgement TestScheduledTrafficResetMonthlySelection TestScheduledTrafficResetOlderWindowKeepsNewUsage TestScheduledTrafficResetPendingWindowCannotUndoManualReset TestScheduledTrafficResetPendingWindowKeepsLaterManualDisable TestScheduledTrafficResetCalendarBoundaries TestClientPolicyLifecycleKeepsManagedRestrictions TestClientPolicyLifecyclePreservesManagedSiblingPrecision TestClientPolicyRenewalPollingPreservesLifetimeAndRestrictions TestClientPolicyFirstUseSettlementPreservesNewerEditsAndRetries TestClientPolicyFirstUseCompilerPollingAndChildRestart; do
            grep -q -- "^--- PASS: $test " /tmp/policy-bootstrap.log
          done
          for test in TestPeriodicTrafficResetRetryKeepsOriginalMembershipAndNewUsage TestPeriodicResetReachesClientNodesConcurrently TestPeriodicResetReachesInboundNodesConcurrently; do
            grep -q -- "^--- PASS: $test " /tmp/policy-bootstrap.log
          done
      - name: Ordinary managed lifecycle and writer boundaries
        run: |
          set -o pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" XRAY_UPSTREAM_E2E_BINARY="$PWD/build/upstream-xray" go test -race ./internal/web/service \
            -run '^Test(LegacyTraffic(Settlement|FirstUse)|FirstUseTrafficSettlement|Traffic(ManagedReconciliationRunsOutsideSerialWriter|ResetManagedReconciliationRunsOutsideSerialWriter|LegacyRuntimePreparationRunsOutsideSerialWriter|Renewal|Runtime|ConfigExportLeavesMaintenanceForPoll|RestartMaintenanceDoesNotHoldRestartLock)|ClientPolicy(Automatic|RestartActivatesNormalService|NormalUserMutation|DetachPreserves|DisableWith|StoppedService|HotChanges|HotGrant|MutationReports|LiveLegacy|PostcommitBindConflict|Editing|CollectorPreserves))' -count=1 -v | tee /tmp/policy-activation.log
          for test in TestClientPolicyAutomaticallyActivatesOwnedTunnel TestClientPolicyAutomaticSelectionUsesLocalListenerBindings TestClientPolicyAutomaticEditHandsOffLiveLegacy TestClientPolicyAutomaticReconcileQueuesStoppedCore TestClientPolicyAutomaticEditReportsUnmeteredLegacyRefusal TestLegacyTrafficSettlementExceedsSQLParameterLimit TestLegacyTrafficSettlementLateWriteRollsBackAllChunks TestLegacyTrafficFirstUseManyInbounds TestFirstUseTrafficSettlementRollsBackEveryWrite TestFirstUseTrafficSettlementDoesNotStartIdleClients TestClientPolicyCollectorPreservesOperationalCountersAndLedger TestClientPolicyDetachPreservesSiblingInboundFlow TestClientPolicyDisableWithCompilerFailureStopsExistingAccess TestClientPolicyDisableWithLostControlStopsExistingAccess TestClientPolicyEditingClearsRunningVLESSReverse TestClientPolicyEditingOtherProtocolPreservesSharedReverse TestClientPolicyHotChangesNegotiateCapabilitiesBeforePreparation TestClientPolicyHotGrantCannotReviveRemovedBinding TestClientPolicyLiveLegacyRefusalLeavesPreparationUntouched TestClientPolicyLiveLegacyHandoffSettlesBeforeSeed TestClientPolicyLiveLegacyHandoffRetriesFailedFinalSQL TestClientPolicyLiveLegacyHandoffRejectsConflictBeforePreparation TestClientPolicyLiveLegacyHandoffRejectsUnmeteredConfig TestClientPolicyLiveLegacyHandoffRejectsChangedBinary TestClientPolicyLiveLegacyHandoffFencesReceiptIdentity TestClientPolicyLiveLegacyHandoffPendingOutlivesOptIn TestClientPolicyLiveLegacyHandoffPinsIdentityAcrossRetry TestClientPolicyLiveLegacyHandoffUsesVerifiedExecutable TestClientPolicyLiveLegacyHandoffDoesNotTrustAPITag TestClientPolicyLiveLegacyHandoffInterruptedPanelRefusesStaleSeed TestClientPolicyLiveLegacyHandoffCompletionRollsBackWithFinalReceipt TestClientPolicyLiveLegacyHandoffCompletedSurvivesPanelRestart TestClientPolicyMutationReportsManagedApplyFailure TestClientPolicyNormalUserMutationPreservesIdentityAndOtherFlows TestClientPolicyPostcommitBindConflictStopsExistingAccess TestClientPolicyRestartActivatesNormalService TestClientPolicyStoppedServiceQueuesNewIdentity TestTrafficConfigExportLeavesMaintenanceForPoll TestTrafficLegacyRuntimePreparationRunsOutsideSerialWriter TestTrafficManagedReconciliationRunsOutsideSerialWriter TestTrafficRenewalDoesNotReplayOverLaterMutation TestTrafficRenewalPreservesPerInboundWireguardPeer TestTrafficResetManagedReconciliationRunsOutsideSerialWriter TestTrafficRestartMaintenanceDoesNotHoldRestartLock TestTrafficRuntimeBatchBoundsReadsAndManagedReconciliation TestTrafficRuntimeReadAndApplySharesInboundMutationLock; do
            grep -q -- "^--- PASS: $test " /tmp/policy-activation.log
          done
      - name: Permanent managed identity deletion
        run: |
          set -o pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" go test -race ./internal/web/service ./internal/web/runtime \
            -run '^Test(ClientPolicyPermanentDeletion|ManagedDeletion)' -count=1 -v | tee /tmp/policy-deletion.log
          for test in TestClientPolicyPermanentDeletionRevokesIdentityAndPreservesUsage TestClientPolicyPermanentDeletionRejectsPreparedIdentityReplay TestClientPolicyPermanentDeletionRollsBackIntentWithRecord TestClientPolicyPermanentDeletionRecoversStoppedOrLostControl TestClientPolicyPermanentDeletionFencesNeverInitializedIdentity TestClientPolicyPermanentDeletionIncludesOrphanEntrypoints TestClientPolicyPermanentDeletionEmptyBulkKeepsUnrelatedPendingWork TestClientPolicyPermanentDeletionBootstrapTraversesHistory TestClientPolicyPermanentDeletionRetriesSQLFailureWithoutRebilling TestClientPolicyPermanentDeletionOrphanEmailMarkerStaysWithinWriter TestClientPolicyPermanentDeletionPreservesSiblingAndReplacement TestManagedDeletionPagesPastUnknownIdentities TestManagedDeletionRejectsStaleBootstrapBeforeAbsenceConfirmation; do
            grep -q -- "^--- PASS: $test " /tmp/policy-deletion.log
          done
      - name: Atomic local traffic settlement
        run: |
          set -o pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" go test -race ./internal/web/job ./internal/web/service ./internal/xray \
            -run '^Test(XrayTrafficJobRetriesUncommittedCountersAtomically|FirstUseTrafficSettlement|ProcessTrafficSettlement)' -count=1 -v | tee /tmp/traffic-settlement.log
          for test in TestXrayTrafficJobRetriesUncommittedCountersAtomically TestFirstUseTrafficSettlementRollsBackEveryWrite TestFirstUseTrafficSettlementDoesNotStartIdleClients TestProcessTrafficSettlementRetriesAndSerializesPolls TestProcessTrafficSettlementFinishesBeforeStopAndResetsForNewChild; do
            grep -q -- "^--- PASS: $test " /tmp/traffic-settlement.log
          done
  policy-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xui_policy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d xui_policy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      XUI_DB_TYPE: postgres
      XUI_DB_DSN: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=xui_policy sslmode=disable"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make dist-stub
      - name: Build custom core for database bootstrap
        run: bash tools/build-custom-core.sh
      - name: Build pinned unmodified core for handoff rejection
        run: |
          upstream_core_dir="$(go mod download -json github.com/xtls/xray-core@v1.260327.1-0.20260908222543-52a412d9e2f5 | jq -er .Dir)"
          go -C "$upstream_core_dir" build -buildvcs=false -o "$GITHUB_WORKSPACE/build/upstream-xray" ./main
      - name: Real PostgreSQL migrations, commit failure and Tunnel ledger
        run: |
          set -o pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" go test -race ./internal/database ./internal/web/service ./internal/web/controller -run 'TestClientStableIdentityMigrationPostgres|TestClientPolicyCrossDatabaseMigration|TestLegacyTrafficReceiptCrossDatabaseMigration|TestClientPolicy(Ledger|StateProvisioning|RuntimeBootstrap|Options|Omission|SyncPreservesAbsentAndExplicitPolicy|RemoteScope|LocalReservation|Desired|Polling|Config|Reset|Accounting|Lifecycle|Renewal|FirstUse)|TestTunnelOwner|TestScheduledTrafficReset' -count=1 -v | tee /tmp/policy-postgres.log
          for test in TestClientPolicySyncPreservesAbsentAndExplicitPolicy TestTunnelOwnerSelectionUsesCanonicalClient TestTunnelOwnerSelectionReadsAuthoritativeIdentity TestTunnelOwnerSelectionRejectsInvalidScopeAtomically TestTunnelOwnerSelectionRollsBackLateLinkFailure TestTunnelOwnerSelectionUpdateRollsBackHistoryAndMembership TestTunnelOwnerSelectionReadRejectsAmbiguityAndDatabaseFailure TestTunnelOwnerSelectionRehomesCanonicalHistoryWithStaleSettings TestTunnelOwnerSelectionRejectsLaterRemoteAttachment TestTunnelOwnerSelectionRejectsLegacyRemoteGraphBeforeUpdateFanout TestTunnelOwnerSelectionRejectsFilteredRemoteMirror TestTunnelOwnerReplacementPreservesHistoryThroughMigration TestTunnelOwnerSelectionReassignsLiveTCPAndUDP TestTunnelOwnerImportIgnoresSourcePanelIdentity TestTunnelOwnerSelectionSerializesWithRemoteAttachment TestClientPolicyRemoteScopeUnboundUpdateSerializesWithAttachment TestClientPolicyRemoteScopeRejectsBeforeFanout TestClientPolicyRemoteScopeSyncBoundary TestClientPolicyRemoteScopeRejectsMirrorAtomically TestClientPolicyRemoteScopeMirrorChecksBeforeIdentityFilters TestClientPolicyRemoteScopeMetadataPreservesStoredPolicy TestClientPolicyLocalReservationRejectsRemoteMembership TestClientPolicyLocalReservationSerializesAgainstRemoteLink TestClientStableIdentityMigrationPostgres TestClientPolicyCrossDatabaseMigration TestLegacyTrafficReceiptCrossDatabaseMigration TestClientPolicyLedgerPostgresCommitFailure TestClientPolicyLedgerRealTunnelAndRestart TestClientPolicyRuntimeBootstrapPreservesLedgerAcrossChildRestarts TestClientPolicyPollingRetriesCommittedTraffic TestTunnelOwnerConcurrentAttachmentsChooseOneOwner TestClientPolicyConfigFeedsRealTunnelLedger TestClientPolicyConfigPreparesEveryPolicyBatch TestClientPolicyResetBatchRollsBackEveryBoundary TestClientPolicyResetBatchRetriesKeepIndependentLatestWindows TestClientPolicyResetBulkPinsMembershipBeforeCoreRecovery TestClientPolicyResetAllRetryExcludesNewClientsAndNewUsage TestClientPolicyResetInboundBatchUsesLinksAndKeepsItsOriginalMembers TestClientPolicyResetBulkCommitsLegacyEnableWithItsCounters TestClientPolicyResetBulkPreservesRemoteInboundFields TestClientPolicyResetRetriesKeepTheLatestWindowAndLifetime TestClientPolicyResetPostgresCommitFailureKeepsPriorPolicy TestClientPolicyResetRuntimePollingRetriesTheCommittedBoundary TestClientPolicyResetEntrypointsProtectStoppedAndPreparedClients TestClientPolicyResetEntrypointsRecheckAfterQueuedBootstrap TestClientPolicyResetEntrypointsRejectReusedEmailWhileQueued TestClientPolicyAccountingPendingIncludesSavedUnpreparedChanges TestClientPolicyAccountingIncludesEverySnapshotBatch TestClientPolicyAccountingWaitsForResetAcknowledgement TestScheduledTrafficResetMonthlySelection TestScheduledTrafficResetOlderWindowKeepsNewUsage TestScheduledTrafficResetPendingWindowCannotUndoManualReset TestScheduledTrafficResetPendingWindowKeepsLaterManualDisable TestScheduledTrafficResetCalendarBoundaries TestClientPolicyLifecycleKeepsManagedRestrictions TestClientPolicyLifecyclePreservesManagedSiblingPrecision TestClientPolicyRenewalPollingPreservesLifetimeAndRestrictions TestClientPolicyFirstUseSettlementPreservesNewerEditsAndRetries TestClientPolicyFirstUseCompilerPollingAndChildRestart; do
            grep -q -- "^--- PASS: $test " /tmp/policy-postgres.log
          done
      - name: Ordinary managed lifecycle and writer boundaries
        run: |
          set -o pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" XRAY_UPSTREAM_E2E_BINARY="$PWD/build/upstream-xray" go test -race ./internal/web/service \
            -run '^Test(LegacyTraffic(Settlement|FirstUse)|FirstUseTrafficSettlement|Traffic(ManagedReconciliationRunsOutsideSerialWriter|ResetManagedReconciliationRunsOutsideSerialWriter|LegacyRuntimePreparationRunsOutsideSerialWriter|Renewal|Runtime|ConfigExportLeavesMaintenanceForPoll|RestartMaintenanceDoesNotHoldRestartLock)|ClientPolicy(Automatic|RestartActivatesNormalService|NormalUserMutation|DetachPreserves|DisableWith|StoppedService|HotChanges|HotGrant|MutationReports|LiveLegacy|PostcommitBindConflict|Editing|CollectorPreserves))' -count=1 -v | tee /tmp/policy-activation.log
          for test in TestClientPolicyAutomaticallyActivatesOwnedTunnel TestClientPolicyAutomaticSelectionUsesLocalListenerBindings TestClientPolicyAutomaticEditHandsOffLiveLegacy TestClientPolicyAutomaticReconcileQueuesStoppedCore TestClientPolicyAutomaticEditReportsUnmeteredLegacyRefusal TestLegacyTrafficSettlementExceedsSQLParameterLimit TestLegacyTrafficSettlementLateWriteRollsBackAllChunks TestLegacyTrafficFirstUseManyInbounds TestFirstUseTrafficSettlementRollsBackEveryWrite TestFirstUseTrafficSettlementDoesNotStartIdleClients TestClientPolicyCollectorPreservesOperationalCountersAndLedger TestClientPolicyDetachPreservesSiblingInboundFlow TestClientPolicyDisableWithCompilerFailureStopsExistingAccess TestClientPolicyDisableWithLostControlStopsExistingAccess TestClientPolicyEditingClearsRunningVLESSReverse TestClientPolicyEditingOtherProtocolPreservesSharedReverse TestClientPolicyHotChangesNegotiateCapabilitiesBeforePreparation TestClientPolicyHotGrantCannotReviveRemovedBinding TestClientPolicyLiveLegacyRefusalLeavesPreparationUntouched TestClientPolicyLiveLegacyHandoffSettlesBeforeSeed TestClientPolicyLiveLegacyHandoffRetriesFailedFinalSQL TestClientPolicyLiveLegacyHandoffRejectsConflictBeforePreparation TestClientPolicyLiveLegacyHandoffRejectsUnmeteredConfig TestClientPolicyLiveLegacyHandoffRejectsChangedBinary TestClientPolicyLiveLegacyHandoffFencesReceiptIdentity TestClientPolicyLiveLegacyHandoffPendingOutlivesOptIn TestClientPolicyLiveLegacyHandoffPinsIdentityAcrossRetry TestClientPolicyLiveLegacyHandoffUsesVerifiedExecutable TestClientPolicyLiveLegacyHandoffDoesNotTrustAPITag TestClientPolicyLiveLegacyHandoffInterruptedPanelRefusesStaleSeed TestClientPolicyLiveLegacyHandoffCompletionRollsBackWithFinalReceipt TestClientPolicyLiveLegacyHandoffCompletedSurvivesPanelRestart TestClientPolicyMutationReportsManagedApplyFailure TestClientPolicyNormalUserMutationPreservesIdentityAndOtherFlows TestClientPolicyPostcommitBindConflictStopsExistingAccess TestClientPolicyRestartActivatesNormalService TestClientPolicyStoppedServiceQueuesNewIdentity TestTrafficConfigExportLeavesMaintenanceForPoll TestTrafficLegacyRuntimePreparationRunsOutsideSerialWriter TestTrafficManagedReconciliationRunsOutsideSerialWriter TestTrafficRenewalDoesNotReplayOverLaterMutation TestTrafficRenewalPreservesPerInboundWireguardPeer TestTrafficResetManagedReconciliationRunsOutsideSerialWriter TestTrafficRestartMaintenanceDoesNotHoldRestartLock TestTrafficRuntimeBatchBoundsReadsAndManagedReconciliation TestTrafficRuntimeReadAndApplySharesInboundMutationLock; do
            grep -q -- "^--- PASS: $test " /tmp/policy-activation.log
          done
      - name: Permanent managed identity deletion
        run: |
          set -o pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" go test -race ./internal/web/service ./internal/web/runtime \
            -run '^Test(ClientPolicyPermanentDeletion|ManagedDeletion)' -count=1 -v | tee /tmp/policy-deletion.log
          for test in TestClientPolicyPermanentDeletionRevokesIdentityAndPreservesUsage TestClientPolicyPermanentDeletionRejectsPreparedIdentityReplay TestClientPolicyPermanentDeletionRollsBackIntentWithRecord TestClientPolicyPermanentDeletionRecoversStoppedOrLostControl TestClientPolicyPermanentDeletionFencesNeverInitializedIdentity TestClientPolicyPermanentDeletionIncludesOrphanEntrypoints TestClientPolicyPermanentDeletionEmptyBulkKeepsUnrelatedPendingWork TestClientPolicyPermanentDeletionBootstrapTraversesHistory TestClientPolicyPermanentDeletionRetriesSQLFailureWithoutRebilling TestClientPolicyPermanentDeletionOrphanEmailMarkerStaysWithinWriter TestClientPolicyPermanentDeletionPreservesSiblingAndReplacement TestManagedDeletionPagesPastUnknownIdentities TestManagedDeletionRejectsStaleBootstrapBeforeAbsenceConfirmation; do
            grep -q -- "^--- PASS: $test " /tmp/policy-deletion.log
          done
      - name: Atomic local traffic settlement
        run: |
          set -o pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" go test -race ./internal/web/job ./internal/web/service \
            -run '^Test(XrayTrafficJobRetriesUncommittedCountersAtomically|FirstUseTrafficSettlement|ProcessTrafficSettlement)' -count=1 -v | tee /tmp/traffic-settlement.log
          for test in TestXrayTrafficJobRetriesUncommittedCountersAtomically TestFirstUseTrafficSettlementRollsBackEveryWrite TestFirstUseTrafficSettlementDoesNotStartIdleClients; do
            grep -q -- "^--- PASS: $test " /tmp/traffic-settlement.log
          done
