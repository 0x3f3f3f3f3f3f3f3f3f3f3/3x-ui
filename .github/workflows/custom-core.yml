            grep -q -- "^--- PASS: $test " /tmp/policy-activation.log
          done
      - name: Permanent managed identity deletion
        run: |
          set -o pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" go test -race ./internal/web/service ./internal/web/runtime \
            -run '^Test(ClientPolicyPermanentDeletion|ManagedDeletion)' -count=1 -v | tee /tmp/policy-deletion.log
          for test in TestClientPolicyPermanentDeletionRevokesIdentityAndPreservesUsage TestClientPolicyPermanentDeletionRejectsPreparedIdentityReplay TestClientPolicyPermanentDeletionRollsBackIntentWithRecord TestClientPolicyPermanentDeletionRecoversStoppedOrLostControl TestClientPolicyPermanentDeletionFencesNeverInitializedIdentity TestClientPolicyPermanentDeletionIncludesOrphanEntrypoints TestClientPolicyPermanentDeletionEmptyBulkKeepsUnrelatedPendingWork TestClientPolicyPermanentDeletionBootstrapTraversesHistory TestClientPolicyPermanentDeletionRetriesSQLFailureWithoutRebilling TestClientPolicyPermanentDeletionOrphanEmailMarkerStaysWithinWriter TestClientPolicyPermanentDeletionPreservesSiblingAndReplacement TestManagedDeletionPagesPastUnknownIdentities TestManagedDeletionRejectsStaleBootstrapBeforeAbsenceConfirmation; do
            grep -q -- "^--- PASS: $test " /tmp/policy-deletion.log
          done
      - name: Atomic local traffic settlement
        run: |
          set -o pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" go test -race ./internal/web/job ./internal/web/service \
            -run '^Test(XrayTrafficJobRetriesUncommittedCountersAtomically|FirstUseTrafficSettlement|ProcessTrafficSettlement)' -count=1 -v | tee /tmp/traffic-settlement.log
          for test in TestXrayTrafficJobRetriesUncommittedCountersAtomically TestFirstUseTrafficSettlementRollsBackEveryWrite TestFirstUseTrafficSettlementDoesNotStartIdleClients; do
            grep -q -- "^--- PASS: $test " /tmp/traffic-settlement.log
          done
      - name: Durable unmatched native traffic postgres
        run: |
          set -euo pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" \
            go test -race -shuffle=on -count=1 -v ./internal/database ./internal/xray ./internal/web/service \
            -run '^TestLegacyUnassignedTraffic|^TestTrafficBatch|^TestLegacyTrafficReceiptCrossDatabaseMigration$|^TestLegacyTrafficConfig|^TestNativeTrafficConfigProof' | tee /tmp/legacy-unassigned-postgres.log
          for test in TestLegacyUnassignedTrafficRetainsExactLabelsAndRetries TestLegacyUnassignedTrafficLateFailureRollsBackAllLayers TestLegacyUnassignedTrafficLateMatchingRowKeepsCapturedClassification TestLegacyUnassignedTrafficManyLabelsLateFailureAndRetry TestLegacyUnassignedTrafficRejectsInvalidInputBeforeWrites TestLegacyUnassignedTrafficValidatorCannotRewriteIntent TestLegacyUnassignedTrafficRejectsCorruptOrOverflowingBucket TestLegacyUnassignedTrafficHistoricalReceiptDoesNotInventHistory TestLegacyUnassignedTrafficReceiptBindsOriginalIntent TestLegacyUnassignedTrafficRealCollectorRetryAndGrowth TestTrafficBatchCapturesSourceAccountingMode TestTrafficBatchRejectsMalformedSourceAccounting TestTrafficBatchAcceptsWhitespaceNullLegacySource TestTrafficBatchPreservesExactNativeLabels TestLegacyUnassignedTrafficPreservesNULAndLiteralEscapeLabels TestLegacyUnassignedTrafficSQLiteBackupAndOldUpgrade TestLegacyUnassignedTrafficCrossDatabaseMigration TestLegacyUnassignedTrafficOldPostgresExport TestLegacyUnassignedTrafficPreReceiptPostgresExport TestLegacyTrafficReceiptCrossDatabaseMigration TestLegacyTrafficConfigProofOriginalDigestReplay TestLegacyTrafficConfigProofDurableMonotonicAndImmutable TestLegacyTrafficConfigProofReceiptRejectsChangedProof TestLegacyTrafficConfigProofValidationAndDetachedIntent TestLegacyTrafficConfigProofLateRollback TestLegacyTrafficConfigProofMissingHistoricalHeaderCannotPromote TestLegacyTrafficConfigProofRealCollectorRetryAndGrowth TestLegacyTrafficConfigSourceSQLiteBackupAndOldUpgrade TestLegacyTrafficConfigSourceCrossDatabaseMigration TestLegacyTrafficConfigSourceOldPostgresExport TestNativeTrafficConfigProofCapturedBeforeFirstPoll TestNativeTrafficConfigProofCannotRestoreAfterConfigChange TestNativeTrafficConfigProofPreservesCanonicalEquivalentConfig TestNativeTrafficConfigProofUnknownCommandRemainsUnknown TestNativeTrafficConfigProofPendingAndFinalSnapshots TestNativeTrafficConfigProofInstallDetectsPreStartChange TestNativeTrafficConfigProofRestartAndFailedStart TestNativeTrafficConfigProofPolicyMutationAndConcurrency TestNativeTrafficConfigProofCanonicalNumbersAndArrays; do
            grep -q -- "^--- PASS: $test " /tmp/legacy-unassigned-postgres.log
          done
          for test in mixed/bucket-write mixed/commit-ack http/bucket-write http/commit-ack; do
            grep -q -- "--- PASS: TestLegacyUnassignedTrafficRealCollectorRetryAndGrowth/$test " /tmp/legacy-unassigned-postgres.log
            grep -q -- "--- PASS: TestLegacyTrafficConfigProofRealCollectorRetryAndGrowth/$test " /tmp/legacy-unassigned-postgres.log
          done
  native-protocol-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make dist-stub
      - name: Native protocol forms, exports and shared existing workflows
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run gen
          npm run typecheck
          npm run lint
          npx vitest run src/test/ssh-*.test.* src/test/mieru-*.test.* src/test/client-form*.test.* src/test/client-qr-modal*.test.* src/test/inbound-form*.test.* src/test/outbound-form*.test.* src/test/tunnel-*-form.test.tsx --maxWorkers=2 --testTimeout=30000
          npm run build
          node --test ../tools/frontend-dependencies.test.mjs
          (cd .. && go test ./tools/frontenddepsverify && go run ./tools/frontenddepsverify build/frontend-licenses frontend/package-lock.json internal/web/dist)

  paired-package-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache-dependency-path: |
            go.sum
            core/xray/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install native static C compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and execute paired offline validation
        env:
          CC: musl-gcc
          PAIRED_RESOURCE_DIR: ${{ runner.temp }}/paired-native-resources
          GOOS: linux
          GOARCH: amd64
          PAIRED_DEV_BUILD: "1"
          PAIRED_PANEL_LDFLAGS: "-linkmode external -extldflags '-static'"
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/paired-review/x-ui"
          mkdir -p "$PAIRED_RESOURCE_DIR/licenses"
          python3 - <<'PYCODE'
          import json, os, shutil, subprocess
          from pathlib import Path
          compiler = shutil.which(os.environ["CC"])
          record = {
              "compilerPath": compiler,
              "compilerVersion": subprocess.check_output([compiler, "--version"], text=True).strip(),
              "installedMuslTools": subprocess.check_output(["dpkg-query", "-W", "musl-tools"], text=True).strip(),
              "go": subprocess.check_output(["go", "env", "GOVERSION"], text=True).strip(),
              "node": subprocess.check_output(["node", "--version"], text=True).strip(),
          }
          (Path(os.environ["PAIRED_RESOURCE_DIR"]) / "licenses/build-toolchains.json").write_text(json.dumps(record, indent=2) + "\n")
          PYCODE
          bash tools/build-paired-package.sh "$package_root"
          "$package_root/x-ui-package" verify "$package_root"
          "$package_root/x-ui" package verify "$package_root"
          "$package_root/bin/xray-linux-amd64" capabilities
          # Tampering must fail; restore only this temporary review fixture.
          cp "$package_root/bin/xray-linux-amd64" "$RUNNER_TEMP/pristine-custom-xray"
          printf 'changed' >> "$package_root/bin/xray-linux-amd64"
          if "$package_root/x-ui-package" verify "$package_root"; then
            echo 'tampered core was accepted' >&2; exit 1
          fi
          cp "$RUNNER_TEMP/pristine-custom-xray" "$package_root/bin/xray-linux-amd64"
          "$package_root/x-ui-package" verify "$package_root"
          mkdir -p "$RUNNER_TEMP/paired-assets"
          cd "$RUNNER_TEMP/paired-assets"
          tar -czf x-ui-linux-amd64.tar.gz -C "$(dirname "$package_root")" x-ui
          cp "$package_root/x-ui-package" x-ui-package-linux-amd64
          sha256sum x-ui-linux-amd64.tar.gz > x-ui-linux-amd64.tar.gz.sha256
          sha256sum x-ui-package-linux-amd64 > x-ui-package-linux-amd64.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: paired-package-review-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/paired-assets/*
