name: Custom core
on:
  push:
    branches: [feature/custom-xray-unified-policy]
    paths: ["core/**", "internal/database/**", "internal/web/service/**", "internal/web/controller/**", "internal/web/job/**", "internal/web/runtime/**", "internal/web/web.go", "internal/xray/**", "tools/build-custom-core.sh", "go.mod", "go.sum", ".github/workflows/custom-core.yml"]
  pull_request:
    paths: ["core/**", "internal/database/**", "internal/web/service/**", "internal/web/controller/**", "internal/web/job/**", "internal/web/runtime/**", "internal/web/web.go", "internal/xray/**", "tools/build-custom-core.sh", "go.mod", "go.sum", ".github/workflows/custom-core.yml"]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            core/xray/go.sum
      - name: Core unit tests
        working-directory: core/xray
        run: go test -shuffle=on -count=1 ./...
      - name: Core race checks
        working-directory: core/xray
        run: |
          go test -race -count=1 ./app/clientpolicy/... ./app/commander ./app/dispatcher ./app/proxyman/inbound ./app/proxyman/outbound ./app/reverse ./app/router ./app/stats ./app/trafficcontrol ./infra/conf ./proxy ./proxy/dokodemo ./proxy/loopback ./proxy/socks ./proxy/http ./proxy/mieru ./proxy/ssh ./proxy/vless/inbound ./proxy/vless/outbound ./proxy/wireguard ./common/buf ./common/mux ./common/protocol ./common/signal ./transport/internet/udp ./transport/internet/websocket ./transport/internet/splithttp ./transport/internet/httpupgrade ./transport/internet/finalmask/realm ./testing/policy
          go test -race -count=1 ./core -run '^(TestRejectedHandlerConstructionClosesProxy|TestTrafficDrain)'
      - name: Tunnel mux routing and legacy compatibility
        working-directory: core/xray
        run: |
          set -euo pipefail
          go test -race -count=1 -v ./testing/policy -run '^(TestTunnelFixedOutboundTreatsMuxDestinationAsPayload|TestLegacyUnownedTunnelMuxStillDispatches)$' | tee /tmp/tunnel-mux-compatibility.log
          for test in TestTunnelFixedOutboundTreatsMuxDestinationAsPayload TestLegacyUnownedTunnelMuxStillDispatches; do
            grep -q -- "--- PASS: $test " /tmp/tunnel-mux-compatibility.log
          done
      - name: Native mieru official-library interoperability and policy
        working-directory: core/xray
        run: |
          set -euo pipefail
          go test -race -count=1 -v ./proxy/mieru ./infra/conf -run '^(TestMieruNative|TestNativeMieru|TestReview)' | tee /tmp/native-mieru.log
          for test in TestNativeMieruOutboundPoolIsolatesAuthenticationAndCancellation TestNativeMieruDisableAndExpiryCloseTCPAndUDP TestNativeMieruAndTunnelShareUploadAndDownloadRate TestReviewUDPPartialHandshakeCannotDefeatTimeout TestReviewUDPFailedHandshakeMustReleaseCapacity TestReviewOutboundHighMultiplexingSharesTransport TestReviewOutboundClientCloseReleasesQuietPeer TestReviewCancellationInterruptsPendingOfficialHandshake TestNativeMieruOutboundHandshakeTimeoutIsAbsolute TestReviewPoolDoesNotShareDistinctSelectedGateways TestReviewPoolCloseCannotLeakLateDialResult TestReviewNativeInboundHonorsSniffing TestReviewUDPAssociateMayUseUnspecifiedTarget TestReviewNativeStreamWrappersAreRejected TestReviewEmptyUDPDatagramReachesTarget TestNativeMieruUDPRoutesEveryDestinationIncludingDomain TestNativeMieruIPv6TCPDestination TestNativeMieruLargeUDPDatagramKeepsBoundaryAndBilling TestNativeMieruConcurrentMuxSameCredentialsRemainUsable TestNativeMieruSharesTunnelPolicyAndLiveQuota TestNativeMieruUnauthenticatedTimeoutReleasesCapacity TestNativeMieruCloseReleasesNativeListeners TestNativeMieruCredentialRotationClosesOldMuxAndPreservesSibling TestNativeMieruOutboundUsesOfficialServer TestNativeMieruOfficialClientPayloadUsesCoreDispatcher TestMieruNativeConfigRejectsUnusableIdentityAndTransport TestMieruNativeConfigBuildsAuthenticatedInboundAndOutbound; do
            grep -q -- "^--- PASS: $test " /tmp/native-mieru.log
          done
      - name: Native SSH OpenSSH forwarding and lifecycle
        working-directory: core/xray
        run: |
          set -euo pipefail
          command -v ssh
          go test -race -count=1 -v -timeout=90s ./proxy/ssh ./testing/policy -run '^(TestOutbound|TestSSH|TestChannel)' | tee /tmp/native-ssh.log
          for test in TestSSHOpenSSHDirectSharesTunnelLedgerAndDisable TestSSHOpenSSHReverseMetersClientRelativeDirection TestSSHNativeOutboundStrictPinAndRoutedPayload TestSSHMissingPolicyAndBlockedRouteCannotReachTarget TestSSHChannelEOFAndCredentialRemovalPreserveTunnelSibling TestSSHAndTunnelShareLiveDirectionalRates TestSSHQuotaAndExpiryCloseIdleTransportAndTunnelSibling TestSSHRestartRetainsBusinessHostKeyAndSharedUsage TestSSHPasswordDefaultOffRejectsCorrectPassword TestSSHPasswordOptInRotationAndRemovalPreserveCanonicalSiblings TestSSHReversePortZeroCancellationAndDisableReleaseOwnedResources TestSSHReverseAuthorizationChecksBindPortAndRealSource TestSSHConnectionChannelHandshakeAndIdleBounds TestSSHCancelledPendingReverseOpenCannotLeakAcceptedChannel TestSSHVerifiedAuthenticationCannotTransferRevokedOfferToReplacement TestSSHStalledControlWriteClosesWithinChannelBound TestChannelCapacityRetainsDelayedPeerCloseAndOwnedDrains TestChannelRetirementTimeoutClosesTransportAndJoinsOwnedDrains TestOutboundUDPReturnsExplicitUnsupportedNetwork TestOutboundHostMismatchReturnsTypedError TestOutboundHandshakeCancellationClosesSuppliedTransport TestOutboundHandshakeUsesAbsoluteDeadline TestOutboundIdleClosesBothCopyDirectionsAtConfiguredDeadline; do
            grep -q -- "^--- PASS: $test " /tmp/native-ssh.log
          done
      - name: Build custom core
        run: bash tools/build-custom-core.sh
      - name: Password proxy identity and credential lifecycle
        working-directory: core/xray
        run: |
          set -euo pipefail
          go test -race -count=1 -v ./testing/policy ./proxy/socks -run '^TestPassword|^TestTempUDPConn' | tee /tmp/password-proxy-lifecycle.log
          for test in TestPasswordProxiesShareTunnelIdentityAndDisconnect TestPasswordProxiesWithoutPolicyFailClosed TestPasswordProxiesCredentialRemovalAndReadd TestPasswordProxiesUDPIdentityAndCredentialCleanup TestPasswordHTTPKeepAlivePreservesRequestIdentity TestPasswordMixedAliasesShareDirectionalRates TestPasswordMixedLegacyNoAuthIgnoresUnusedAccounts TestPasswordProxiesEmptyAccountsStayAuthenticated TestPasswordProxiesPreserveLegacyAnonymousAndLabels TestTempUDPConnCloseBeforeTimeout TestTempUDPConnConcurrentTimeoutAndClose; do
            grep -q -- "^--- PASS: $test " /tmp/password-proxy-lifecycle.log
          done
      - name: Build missing password identity capability fixture
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          source = Path("core/xray/app/clientpolicy/command/command.go").resolve()
          fixture = Path(os.environ["RUNNER_TEMP"]) / "password-identity-capability-fixture"
          fixture.mkdir(exist_ok=True)
          text = source.read_text()
          capability = 'features = append(features, "trusted-socks-client-id-v1", "trusted-http-client-id-v1")'
          assert text.count(capability) == 1
          replacement = fixture / "command.go"
          replacement.write_text(text.replace(capability, "", 1))
          (fixture / "overlay.json").write_text(json.dumps({"Replace": {str(source): str(replacement)}}))
          PYCODE
          go -C core/xray build -overlay="$RUNNER_TEMP/password-identity-capability-fixture/overlay.json" -o "$PWD/build/pre-password-identity-xray" ./main
      - name: Password proxy capability negotiation
        run: |
          set -euo pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" XRAY_PRE_PASSWORD_IDENTITY_E2E_BINARY="$PWD/build/pre-password-identity-xray" \
            go test -race -count=1 -v ./internal/xray -run '^TestPasswordProxy' | tee /tmp/password-proxy-capability.log
          for test in TestPasswordProxyHandlerCapabilitiesBeforeMutation TestPasswordProxyEmptyAuthenticationRequiresCapability TestPasswordProxyAccountRejectsInvalidCredentialTypes TestPasswordProxyStartupNegotiatesBeforePreparation; do
            grep -q -- "^--- PASS: $test " /tmp/password-proxy-capability.log
          done
      - name: Canonical password account ownership
        run: |
          set -euo pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" go test -race -shuffle=on -count=1 -v ./internal/web/service -run '^TestPasswordProxyOwner' | tee /tmp/password-owner-sqlite.log
          for test in TestPasswordProxyOwnersPreserveCanonicalRecords TestPasswordProxyOwnerLateSQLRollback TestPasswordProxyOwnerReadsRejectStaleMembership TestPasswordProxyOwnerCannotGainRemoteMembership TestPasswordProxyOwnerNativeAliasesAndCaseVariants TestPasswordProxyOwnerMixedToEmptyHTTPRemainsProtected TestPasswordProxyOwnerLegacyIgnoredEmailRemainsReadable TestPasswordProxyOwnerListenerDeletionPreservesSiblingHistory TestPasswordProxyOwnerRemovalEntrypoints TestPasswordProxyOwnerRemovalScopeBeforeFanout TestPasswordProxyOwnerRemovalSQLRollback TestPasswordProxyOwnerRemovalFinalDeletionRecheck TestPasswordProxyOwnerRemovalCannotHideMissingMembership TestPasswordProxyOwnerRemovalPinsSingleIdentityAcrossRename TestPasswordProxyOwnerRemovalLostAcknowledgement TestPasswordProxyOwnerRemovalRealCore TestPasswordProxyOwnerSingleUpdatePreservesResourceCredentials TestPasswordProxyOwnerSingleUpdateOmissionAndClearing TestPasswordProxyOwnerSingleUpdateInheritsCurrentPolicy TestPasswordProxyOwnerSingleUpdateScopeBeforeFilter TestPasswordProxyOwnerSingleUpdateSQLRollback TestPasswordProxyOwnerSingleUpdateRejectsReusedEmail TestPasswordProxyOwnerSingleUpdateRealCore TestPasswordProxyOwnerSingleUpdateLostAcknowledgement TestPasswordProxyOwnerSingleUpdateRenamesAllHistory TestPasswordProxyOwnerSingleUpdateRejectsLateDestination TestPasswordProxyOwnerSingleUpdateFilteredRenameRemainsUsable TestPasswordProxyOwnerSingleUpdateLateGraphBeforeWrites TestPasswordProxyOwnerSingleUpdateAmbiguousEmptyTunnel TestPasswordProxyOwnerSingleUpdatePreservesOmittedTunnelKeys TestPasswordProxyOwnerSingleUpdateFilteredFailurePreservesSelectedCredentials TestPasswordProxyOwnerFieldsPublicEntrypoints TestPasswordProxyOwnerFieldsEmptyTunnelWithoutClients TestPasswordProxyOwnerFieldsPreserveCurrentOtherFields TestPasswordProxyOwnerFieldsSQLRollback TestPasswordProxyOwnerFieldsMatchingEnableReconciles TestPasswordProxyOwnerFieldsScopeBeforeWrites TestPasswordProxyOwnerFieldsRejectReusedEmail TestPasswordProxyOwnerFieldsRejectLateMembership TestPasswordProxyOwnerFieldsBulkPartitionsInvalidOwners TestPasswordProxyOwnerFieldsBulkBatchesSharedGraphs TestPasswordProxyOwnerFieldsRealCore TestPasswordProxyOwnerFieldsLostAcknowledgement TestPasswordProxyOwnerFieldsClassificationLossAndEmailReuse TestPasswordProxyOwnerFieldsClassificationGain TestPasswordProxyOwnerFieldsClassificationLoss TestPasswordProxyOwnerFieldsBulkRetainsPriorSuccess TestPasswordProxyOwnerFieldsRelativeExpiryFirstUse TestPasswordProxyOwnerFieldsRelativeExpiryFirstUseSibling; do
            grep -q -- "^--- PASS: $test " /tmp/password-owner-sqlite.log
          done
      - name: Password owner API and SQLite recovery contracts
        run: |
          set -euo pipefail
          go test -race -shuffle=on -count=1 -v ./internal/web/controller ./internal/database -run '^TestPasswordProxyOwner(APIResourceContracts|BackupRestore)$' | tee /tmp/password-owner-contracts.log
          for test in TestPasswordProxyOwnerAPIResourceContracts TestPasswordProxyOwnerBackupRestore; do
            grep -q -- "^--- PASS: $test " /tmp/password-owner-contracts.log
          done
      - name: Canonical password runtime configuration
        run: |
          set -euo pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" \
            go test -race -shuffle=on -count=1 -v ./internal/web/service -run '^TestPasswordProxyConfig' | tee /tmp/password-config-sqlite.log
          for test in TestPasswordProxyConfigUsesCanonicalOwners TestPasswordProxyConfigProtectedEmptyListener TestPasswordProxyConfigRejectsUnownedAccounts TestPasswordProxyConfigRestoredHTTPProtection TestPasswordProxyConfigDisabledOwnersKeepAuthentication TestPasswordProxyConfigSnapshotPreservesOwnerAndCredential TestPasswordProxyConfigRejectsStaleMembershipBeforePreparation TestPasswordProxyConfigRejectsAnonymousResources TestPasswordProxyConfigNormalizesActiveAliasAndOmitsDormantUsers TestPasswordProxyConfigFeedsRealSharedLedger; do
            grep -q -- "^--- PASS: $test " /tmp/password-config-sqlite.log
          done
      - name: Managed password credential hot changes
        run: |
          set -euo pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" \
            go test -race -shuffle=on -count=1 -v ./internal/xray ./internal/web/service -run '^TestComputeManagedPasswordHotDiff|^TestPasswordProxyHot' | tee /tmp/password-hot-sqlite.log
          for test in TestComputeManagedPasswordHotDiffGroupsOwnerAliases TestComputeManagedPasswordHotDiffReorderIsEmpty TestComputeManagedPasswordHotDiffTransfersAndRemoves TestComputeManagedPasswordHotDiffRejectsAmbiguousOwners TestComputeManagedPasswordHotDiffPreservesLegacyPath TestPasswordProxyHotRemovalRequiresProtocolCapabilities TestPasswordProxyHotAddPreservesListenerLevel TestPasswordProxyHotAddRejectsInvalidLevelBeforeMutation TestPasswordProxyHotCapabilitiesBeforePreparation TestPasswordProxyHotChangesPreserveSiblingAndLedger TestPasswordProxyHotPartialFailureStopsAndRecovers; do
            grep -q -- "^--- PASS: $test " /tmp/password-hot-sqlite.log
          done
      - name: Build missing credential capability fixture
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source = Path("core/xray/app/clientpolicy/command/command.go").resolve()
          fixture = Path(os.environ["RUNNER_TEMP"]) / "policy-capability-fixture"
          fixture.mkdir(exist_ok=True)
          text = source.read_text()
          capability = ', "authenticated-credential-revocation-v1"'
          assert text.count(capability) == 1
          replacement = fixture / "command.go"
          replacement.write_text(text.replace(capability, "", 1))
          (fixture / "overlay.json").write_text(json.dumps({"Replace": {str(source): str(replacement)}}))
          PY
          go -C core/xray build -overlay="$RUNNER_TEMP/policy-capability-fixture/overlay.json" -o "$PWD/build/pre-revocation-xray" ./main
      - name: Build missing source ACL capability fixture
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          source = Path("core/xray/app/clientpolicy/command/command.go").resolve()
          fixture = Path(os.environ["RUNNER_TEMP"]) / "source-acl-capability-fixture"
          fixture.mkdir(exist_ok=True)
          text = source.read_text()
          capability = 'features = append(features, "tunnel-source-acl-v1")'
          assert text.count(capability) == 1
          replacement = fixture / "command.go"
          replacement.write_text(text.replace(capability, "", 1))
          (fixture / "overlay.json").write_text(json.dumps({"Replace": {str(source): str(replacement)}}))
          PYCODE
          go -C core/xray build -overlay="$RUNNER_TEMP/source-acl-capability-fixture/overlay.json" -o "$PWD/build/pre-source-acl-xray" ./main
      - name: Tunnel source ACL and safe owner deletion
        run: |
          set -o pipefail
          make dist-stub
          XRAY_E2E_BINARY="$PWD/build/custom-xray" XRAY_PRE_SOURCE_ACL_E2E_BINARY="$PWD/build/pre-source-acl-xray" \
            go test -race ./internal/web/service ./internal/xray -run '^TestTunnelSourceACL' -count=1 -v | tee /tmp/tunnel-source-acl.log
          for test in TestTunnelSourceACLHotNarrowingPreservesSiblingAndLedger TestTunnelSourceACLDriftedOwnerDeletionReleasesLivePorts TestTunnelSourceACLStartupNegotiatesBeforePreparation TestTunnelSourceACLRequiresCapabilityBeforeHandlerMutation TestTunnelSourceACLRejectsInvalidCreateAndUpdateAtomically TestTunnelSourceACLOwnerDetachAndReenable TestTunnelSourceACLRequiresCanonicalOwnerWhenEnabled TestTunnelSourceACLRestoredRowsCannotBypassValidation TestTunnelSourceACLDeleteOwnerWithDriftedSettings TestTunnelSourceACLDeleteRechecksConcurrentAttachment TestTunnelSourceACLConcurrentEnableAndDetach; do
            grep -q -- "^--- PASS: $test " /tmp/tunnel-source-acl.log
          done
      - name: Build missing fixed outbound capability fixture
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          source = Path("core/xray/app/clientpolicy/command/command.go").resolve()
          fixture = Path(os.environ["RUNNER_TEMP"]) / "fixed-outbound-capability-fixture"
          fixture.mkdir(exist_ok=True)
          text = source.read_text()
          capability = 'features = append(features, "tunnel-fixed-outbound-v1")'
          assert text.count(capability) == 1
          replacement = fixture / "command.go"
          replacement.write_text(text.replace(capability, "", 1))
          (fixture / "overlay.json").write_text(json.dumps({"Replace": {str(source): str(replacement)}}))
          PYCODE
          go -C core/xray build -overlay="$RUNNER_TEMP/fixed-outbound-capability-fixture/overlay.json" -o "$PWD/build/pre-fixed-outbound-xray" ./main
      - name: Tunnel fixed outbound selection and lifecycle
        run: |
          set -o pipefail
          make dist-stub
          XRAY_E2E_BINARY="$PWD/build/custom-xray" XRAY_PRE_FIXED_OUTBOUND_E2E_BINARY="$PWD/build/pre-fixed-outbound-xray" \
            go test -race ./internal/web/service ./internal/xray -run '^TestTunnelFixedOutbound' -count=1 -v | tee /tmp/tunnel-fixed-outbound.log
          for test in TestTunnelFixedOutboundHotChangePreservesSiblingAndLedger TestTunnelFixedOutboundRejectsInvalidSaveAtomically TestTunnelFixedOutboundRequiresOwnerBeforeEnable TestTunnelFixedOutboundPreservesRemovedSubscriptionSelection TestTunnelFixedOutboundRequiresCapabilityBeforeHandlerMutation TestTunnelFixedOutboundStartupNegotiatesBeforePreparation; do
            grep -q -- "^--- PASS: $test " /tmp/tunnel-fixed-outbound.log
          done
      - name: Build panel against same managed source
        run: make dist-stub && go build ./...
      - name: Panel policy SQLite and adapter race checks
        run: go test -race ./internal/database ./internal/web/service ./internal/xray -run 'TestClientStableIdentity|TestClientPolicyLedger|TestClientPolicyAdapter|TestTunnelOwner' -count=1
      - name: Build pinned unmodified core for rejection regression
        run: |
          upstream_core_dir="$(go mod download -json github.com/xtls/xray-core@v1.260327.1-0.20260908222543-52a412d9e2f5 | jq -er .Dir)"
          go -C "$upstream_core_dir" build -buildvcs=false -o "$GITHUB_WORKSPACE/build/upstream-xray" ./main
      - name: Runtime transport and negotiated process activation
        run: |
          set -o pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" XRAY_UPSTREAM_E2E_BINARY="$PWD/build/upstream-xray" XRAY_PRE_REVOCATION_E2E_BINARY="$PWD/build/pre-revocation-xray" \
            go test -race ./internal/xray ./internal/web/runtime -run 'TestManagedProcess|TestManagedMutation|TestLocalRuntimeUsesPrivateControl|TestXrayAPI_E2E|TestExplicitControlEndpoint|TestPrivateControl|TestFinalTraffic|TestTrafficControl|TestAutomaticTrafficControl|TestTrafficHandoffImage' -count=1 -v | tee /tmp/policy-process.log
          for test in TestManagedProcessNegotiatesAndSeedsBeforeOpeningListeners TestManagedProcessRejectsUnmodifiedCoreBeforeBusinessTraffic TestManagedProcessNegotiatesCredentialRevocationBeforePreparation TestManagedMutationRequiresCredentialRevocationBeforeHandlerChanges TestLocalRuntimeUsesPrivateControlForHandlersRoutingAndStats TestFinalTrafficReplaysPendingThenSettlesFreshSnapshot TestFinalTrafficStartupCannotPinAnotherProcess TestFinalTrafficRejectsCancellationAfterPendingReplay TestFinalTrafficRejectsExhaustedSequenceBeforeDrain TestTrafficControlClientPinsEveryPageAndRejectsWrongPeer TestTrafficControlEndpointChangesRequireRestart TestAutomaticTrafficControlPinsCustomChildWithoutChangingDesiredConfig TestAutomaticTrafficControlCleansRejectedChild TestAutomaticTrafficControlPreservesExplicitDirectory TestAutomaticTrafficControlVersionHint TestFinalTrafficCounterNamesPreserveDelimiterEmails TestFinalTrafficOwnersRetainAdditionsBeforeDrain TestFinalTrafficOwnersRejectAdditionsAfterDrain TestFinalTrafficOwnershipBlocksOrdinaryPolling TestTrafficHandoffImageMustExecuteBeforeReturning TestTrafficHandoffImagePreservesDefaultResourceDirectory; do
            grep -q -- "^--- PASS: $test " /tmp/policy-process.log
          done
      - name: SQLite policy persistence and Runtime client edits
        run: |
          set -o pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" go test -race ./internal/web/service ./internal/web/job ./internal/web/controller \
            -run 'TestTunnelOwner|TestClientStandalone|TestClientPolicy(StateProvisioning|RuntimeBootstrap|Options|Omission|SyncPreservesAbsentAndExplicitPolicy|RemoteScope|LocalReservation|Desired|Polling|Config|Reset|Accounting|Lifecycle|Renewal|FirstUse)|TestScheduledTrafficReset|TestPeriodicTrafficReset|TestPeriodicResetReaches' -count=1 -v | tee /tmp/policy-bootstrap.log
          for test in TestClientStandaloneCreationFeedsRealTunnelLedger TestClientStandaloneCreatePreservesAccountBeforeTunnelAttachment TestClientStandaloneCreateRejectsDuplicateIdentityWithoutOverwrite TestClientStandaloneCreateRollsBackDisabledCorrection TestClientStandaloneCreateJSONOnEmptyPanel TestClientPolicySyncPreservesAbsentAndExplicitPolicy TestTunnelOwnerSelectionUsesCanonicalClient TestTunnelOwnerSelectionReadsAuthoritativeIdentity TestTunnelOwnerSelectionRejectsInvalidScopeAtomically TestTunnelOwnerSelectionRollsBackLateLinkFailure TestTunnelOwnerSelectionUpdateRollsBackHistoryAndMembership TestTunnelOwnerSelectionReadRejectsAmbiguityAndDatabaseFailure TestTunnelOwnerSelectionRehomesCanonicalHistoryWithStaleSettings TestTunnelOwnerSelectionRejectsLaterRemoteAttachment TestTunnelOwnerSelectionRejectsLegacyRemoteGraphBeforeUpdateFanout TestTunnelOwnerSelectionRejectsFilteredRemoteMirror TestTunnelOwnerReplacementPreservesHistoryThroughMigration TestTunnelOwnerSelectionReassignsLiveTCPAndUDP TestTunnelOwnerImportIgnoresSourcePanelIdentity TestClientPolicyRemoteScopeRejectsBeforeFanout TestClientPolicyRemoteScopeSyncBoundary TestClientPolicyRemoteScopeRejectsMirrorAtomically TestClientPolicyRemoteScopeMirrorChecksBeforeIdentityFilters TestClientPolicyRemoteScopeMetadataPreservesStoredPolicy TestClientPolicyLocalReservationRejectsRemoteMembership TestClientPolicyRuntimeBootstrapPreservesLedgerAcrossChildRestarts TestClientPolicyPollingRetriesCommittedTraffic TestClientPolicyConfigFeedsRealTunnelLedger TestClientPolicyConfigPreparesEveryPolicyBatch TestClientPolicyResetBatchRollsBackEveryBoundary TestClientPolicyResetBatchRetriesKeepIndependentLatestWindows TestClientPolicyResetBulkPinsMembershipBeforeCoreRecovery TestClientPolicyResetAllRetryExcludesNewClientsAndNewUsage TestClientPolicyResetInboundBatchUsesLinksAndKeepsItsOriginalMembers TestClientPolicyResetBulkCommitsLegacyEnableWithItsCounters TestClientPolicyResetBulkPreservesRemoteInboundFields TestClientPolicyResetRetriesKeepTheLatestWindowAndLifetime TestClientPolicyResetRuntimePollingRetriesTheCommittedBoundary TestClientPolicyResetEntrypointsProtectStoppedAndPreparedClients TestClientPolicyResetEntrypointsRecheckAfterQueuedBootstrap TestClientPolicyResetEntrypointsRejectReusedEmailWhileQueued TestClientPolicyAccountingPendingIncludesSavedUnpreparedChanges TestClientPolicyAccountingIncludesEverySnapshotBatch TestClientPolicyAccountingWaitsForResetAcknowledgement TestScheduledTrafficResetMonthlySelection TestScheduledTrafficResetOlderWindowKeepsNewUsage TestScheduledTrafficResetPendingWindowCannotUndoManualReset TestScheduledTrafficResetPendingWindowKeepsLaterManualDisable TestScheduledTrafficResetCalendarBoundaries TestClientPolicyLifecycleKeepsManagedRestrictions TestClientPolicyLifecyclePreservesManagedSiblingPrecision TestClientPolicyRenewalPollingPreservesLifetimeAndRestrictions TestClientPolicyFirstUseSettlementPreservesNewerEditsAndRetries TestClientPolicyFirstUseCompilerPollingAndChildRestart; do
            grep -q -- "^--- PASS: $test " /tmp/policy-bootstrap.log
          done
          for test in TestPeriodicTrafficResetRetryKeepsOriginalMembershipAndNewUsage TestPeriodicResetReachesClientNodesConcurrently TestPeriodicResetReachesInboundNodesConcurrently; do
            grep -q -- "^--- PASS: $test " /tmp/policy-bootstrap.log
          done
      - name: Ordinary managed lifecycle and writer boundaries
        run: |
          set -o pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" XRAY_UPSTREAM_E2E_BINARY="$PWD/build/upstream-xray" go test -race ./internal/web/service \
            -run '^Test(LegacyTraffic(Settlement|FirstUse)|FirstUseTrafficSettlement|Traffic(ManagedReconciliationRunsOutsideSerialWriter|ResetManagedReconciliationRunsOutsideSerialWriter|LegacyRuntimePreparationRunsOutsideSerialWriter|Renewal|Runtime|ConfigExportLeavesMaintenanceForPoll|RestartMaintenanceDoesNotHoldRestartLock)|ClientPolicy(Automatic|RestartActivatesNormalService|NormalUserMutation|DetachPreserves|DisableWith|StoppedService|HotChanges|HotGrant|MutationReports|LiveLegacy|PostcommitBindConflict|Editing|CollectorPreserves))' -count=1 -v | tee /tmp/policy-activation.log
          for test in TestClientPolicyAutomaticallyActivatesOwnedTunnel TestClientPolicyAutomaticSelectionUsesLocalListenerBindings TestClientPolicyAutomaticEditHandsOffLiveLegacy TestClientPolicyAutomaticReconcileQueuesStoppedCore TestClientPolicyAutomaticEditReportsUnmeteredLegacyRefusal TestLegacyTrafficSettlementExceedsSQLParameterLimit TestLegacyTrafficSettlementLateWriteRollsBackAllChunks TestLegacyTrafficFirstUseManyInbounds TestFirstUseTrafficSettlementRollsBackEveryWrite TestFirstUseTrafficSettlementDoesNotStartIdleClients TestClientPolicyCollectorPreservesOperationalCountersAndLedger TestClientPolicyDetachPreservesSiblingInboundFlow TestClientPolicyDisableWithCompilerFailureStopsExistingAccess TestClientPolicyDisableWithLostControlStopsExistingAccess TestClientPolicyEditingClearsRunningVLESSReverse TestClientPolicyEditingOtherProtocolPreservesSharedReverse TestClientPolicyHotChangesNegotiateCapabilitiesBeforePreparation TestClientPolicyHotGrantCannotReviveRemovedBinding TestClientPolicyLiveLegacyRefusalLeavesPreparationUntouched TestClientPolicyLiveLegacyHandoffSettlesBeforeSeed TestClientPolicyLiveLegacyHandoffRetriesFailedFinalSQL TestClientPolicyLiveLegacyHandoffRejectsConflictBeforePreparation TestClientPolicyLiveLegacyHandoffRejectsUnmeteredConfig TestClientPolicyLiveLegacyHandoffRejectsChangedBinary TestClientPolicyLiveLegacyHandoffFencesReceiptIdentity TestClientPolicyLiveLegacyHandoffPendingOutlivesOptIn TestClientPolicyLiveLegacyHandoffPinsIdentityAcrossRetry TestClientPolicyLiveLegacyHandoffUsesVerifiedExecutable TestClientPolicyLiveLegacyHandoffDoesNotTrustAPITag TestClientPolicyLiveLegacyHandoffInterruptedPanelRefusesStaleSeed TestClientPolicyLiveLegacyHandoffCompletionRollsBackWithFinalReceipt TestClientPolicyLiveLegacyHandoffCompletedSurvivesPanelRestart TestClientPolicyMutationReportsManagedApplyFailure TestClientPolicyNormalUserMutationPreservesIdentityAndOtherFlows TestClientPolicyPostcommitBindConflictStopsExistingAccess TestClientPolicyRestartActivatesNormalService TestClientPolicyStoppedServiceQueuesNewIdentity TestTrafficConfigExportLeavesMaintenanceForPoll TestTrafficLegacyRuntimePreparationRunsOutsideSerialWriter TestTrafficManagedReconciliationRunsOutsideSerialWriter TestTrafficRenewalDoesNotReplayOverLaterMutation TestTrafficRenewalPreservesPerInboundWireguardPeer TestTrafficResetManagedReconciliationRunsOutsideSerialWriter TestTrafficRestartMaintenanceDoesNotHoldRestartLock TestTrafficRuntimeBatchBoundsReadsAndManagedReconciliation TestTrafficRuntimeReadAndApplySharesInboundMutationLock; do
            grep -q -- "^--- PASS: $test " /tmp/policy-activation.log
          done
      - name: Permanent managed identity deletion
        run: |
          set -o pipefail
          XRAY_E2E_BINARY="$PWD/build/custom-xray" go test -race ./internal/web/service ./internal/web/runtime \
