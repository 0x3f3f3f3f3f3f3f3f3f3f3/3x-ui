name: Build paired 3X-UI Docker image

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish images from main (requires registry credentials)
        type: boolean
        default: false
  push:
    branches: [feature/custom-xray-unified-policy, feature/paired-custom-core-distribution]
    tags: ["v*.*.*"]
    paths: ["Docker*", ".dockerignore", "install.sh", "update.sh", "x-ui.sh", "core/**", "internal/**", "tools/**", "frontend/**", "go.mod", "go.sum", ".github/workflows/docker.yml"]

jobs:
  build-review:
    if: (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && (!inputs.publish || github.ref != 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build review image archive
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/paired-image-review.tar
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7,linux/arm/v6,linux/386
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            PAIRED_DEV_BUILD=1
          tags: paired-3x-ui:review
      - name: Checksum review archive
        working-directory: ${{ runner.temp }}
        run: sha256sum paired-image-review.tar > paired-image-review.tar.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: paired-docker-review-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/paired-image-review.tar
            ${{ runner.temp }}/paired-image-review.tar.sha256

  publish:
    # Feature push and default dispatch have no registry login/push path.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ vars.DOCKER_IMAGE || 'hsanaeii/3x-ui' }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push paired image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7,linux/arm/v6,linux/386
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            PAIRED_DEV_BUILD=${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
