syntax = "proto3";

package xray.app.clientpolicy;
option go_package = "github.com/xtls/xray-core/app/clientpolicy";

message PolicyConfig {
  string client_id = 1;
  uint64 version = 2;
  bool enabled = 3;
  uint64 multiplier_micros = 4;
  uint64 quota_bytes = 5;
  uint64 upload_bytes_per_second = 6;
  uint64 download_bytes_per_second = 7;
  uint64 burst_bytes = 8;
  int64 expires_at = 9;
}

message Config {
  repeated PolicyConfig policies = 1;
}
