syntax = "proto3";
package xray.app.clientpolicy.command.v1;
option go_package = "github.com/xtls/xray-core/app/clientpolicy/command";
import "app/clientpolicy/config.proto";

message Empty {}
message ClientRequest { string client_id = 1; uint64 expected_policy_version = 2; string inbound_tag = 3; }
message Capabilities {
 uint32 api_version = 1;
 string core_version = 2;
 string instance_id = 3;
 uint64 epoch = 4;
 repeated string capabilities = 5;
	uint64 reservation_raw_bytes = 6;
	string boot_id = 7;
}
message AuthorityChallengeRequest { string expected_boot_id = 1; }
message AuthorityChallenge {
 string instance_id = 1;
 string boot_id = 2;
 string challenge_id = 3;
 uint64 max_duration_millis = 4;
}
message AuthorityBinding { string authority_id = 1; uint64 generation = 2; string node_id = 3; }
message AuthorityShare { bool unlimited = 1; uint64 rate = 2; uint64 burst = 3; }
message AuthorityBindRequest { string expected_boot_id = 1; AuthorityBinding authority = 2; }
message ExecutionGrant {
 AuthorityBinding authority = 1;
 string instance_id = 2;
 string boot_id = 3;
 string client_id = 4;
 string window_id = 5;
 uint64 policy_version = 6;
 string grant_id = 7;
 uint64 sequence = 8;
 string challenge_id = 9;
 uint64 capacity = 10;
 AuthorityShare upload = 11;
 AuthorityShare download = 12;
 uint64 lease_duration_millis = 13;
}
message AuthorityGrantRequest { string expected_boot_id = 1; string client_id = 2; string grant_id = 3; bool preserve_sessions = 4; }
message AuthorityRenewalRequest { string expected_boot_id = 1; string client_id = 2; string grant_id = 3; string challenge_id = 4; uint64 sequence = 5; uint64 lease_duration_millis = 6; }
message ExecutionGrantState { ExecutionGrant grant = 1; Usage usage = 2; uint64 sequence = 3; bool sealed = 4; }
message Usage {
 uint64 raw_upload = 1;
 uint64 raw_download = 2;
 uint64 billed_bytes = 3;
 uint64 remainder = 4;
}
message ClientState {
 xray.app.clientpolicy.PolicyConfig policy = 1;
 Usage usage = 2;
 uint64 uncertain_bytes = 3;
 uint32 reasons = 4;
 uint32 active_sessions = 5;
 int64 first_used_at = 6;
}
message ApplyRequest { repeated xray.app.clientpolicy.PolicyConfig policies = 1; }
message InitializeRequest { xray.app.clientpolicy.PolicyConfig policy = 1; Usage usage = 2; }
message Connection {
 uint64 session_id = 1;
 string inbound_tag = 2;
 string authenticated_account = 3;
 string original_target = 4;
 string actual_target = 5;
 uint64 policy_version = 6;
}
message Connections { repeated Connection connections = 1; }
message CloseResult { uint32 closed = 1; }
message LedgerRequest { uint64 after_sequence = 1; uint32 limit = 2; }
message LedgerRecord {
 string instance_id = 1;
 uint64 epoch = 2;
 uint64 sequence = 3;
 string client_id = 4;
 uint64 policy_version = 5;
 Usage usage = 6;
 uint64 uncertain_bytes = 7;
 uint64 reserved_bytes = 8;
 bool revoked = 9;
 int64 first_used_at = 10;
}
message LedgerPage { repeated LedgerRecord records = 1; uint64 next_sequence = 2; }
service ClientPolicyService {
 rpc GetCapabilities(Empty) returns (Capabilities);
 rpc GetAuthorityChallenge(AuthorityChallengeRequest) returns (AuthorityChallenge);
 rpc BindAuthority(AuthorityBindRequest) returns (Empty);
 rpc InstallAuthorityGrant(ExecutionGrant) returns (ExecutionGrantState);
 rpc GetAuthorityGrant(AuthorityGrantRequest) returns (ExecutionGrantState);
 rpc SealAuthorityGrant(AuthorityGrantRequest) returns (ExecutionGrantState);
 rpc RenewAuthorityGrant(AuthorityRenewalRequest) returns (Empty);
 rpc GetClient(ClientRequest) returns (ClientState);
 rpc ApplyPolicies(ApplyRequest) returns (Empty);
 rpc InitializeClient(InitializeRequest) returns (Empty);
 rpc RevokeClient(ClientRequest) returns (Empty);
 rpc ListConnections(ClientRequest) returns (Connections);
 rpc CloseConnections(ClientRequest) returns (CloseResult);
 rpc CheckpointUsage(Empty) returns (Empty);
 rpc ReadLedger(LedgerRequest) returns (LedgerPage);
}
message Config {}
