version: "2"

run:
  build-tags: []
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - noctx
    - misspell
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    paths:
      - frontend
      - internal/web/dist
    rules:
      # Preserve pinned upstream code; authored managed_resources files stay fully linted.
      - path: '^internal/mieru/native/(low_entropy|metadata|mux|padding|scheduler|segment|server_session_validation|server_user_session_benchmark_test|server_user_test_helpers_test|server_user_transport_integration_test|server_user_test|session|underlay|underlay_base|underlay_low_entropy_test|underlay_packet|underlay_stream)(_test)?\.go$'
        linters:
          - errcheck
          - errorlint
          - staticcheck
          - unconvert
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - noctx
      # tools/openapigen relies on go/parser.ParseDir; migrating it to
      # golang.org/x/tools/go/packages is a generator change, out of scope here.
      - linters:
          - staticcheck
        text: 'SA1019: (go/)?parser\.ParseDir'
      # ST1005 (capitalized error strings) conflicts with intentional
      # user-facing error copy that tests assert verbatim.
      - linters:
          - staticcheck
        text: "ST1005:"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mhsanaei/3x-ui
  exclusions:
    paths:
      - '^internal/mieru/native/(low_entropy|metadata|mux|padding|scheduler|segment|server_session_validation|server_user_session_benchmark_test|server_user_test_helpers_test|server_user_transport_integration_test|server_user_test|session|underlay|underlay_base|underlay_low_entropy_test|underlay_packet|underlay_stream)(_test)?\.go$'
      - frontend
      - internal/web/dist
